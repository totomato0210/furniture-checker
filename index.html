<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>家具配置チェッカー</title>
<style>
:root{
  --red:#d32f2f; --yel:#e69500; --blue:#1565c0; --ok:#2e7d32;
  --bg:#f4f5f7; --line:#d5d8dd; --text:#222; --sub:#5f6368;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  color:var(--text);background:var(--bg);color-scheme:light;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* 上部バー */
#top{flex:none;height:48px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#fff;border-bottom:1px solid var(--line)}
#btnRoom{flex:1;min-width:0;height:44px;border:0;background:none;text-align:left;font-weight:700;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#badge{height:44px;min-width:64px;padding:0 12px;border:0;border-radius:22px;color:#fff;font-weight:700;background:var(--ok)}
#badge.red{background:var(--red)} #badge.yel{background:var(--yel)}
#btnMenu{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:20px;line-height:1}

#notice{flex:none;display:none;align-items:center;gap:8px;padding:6px 8px;background:#fff7e0;border-bottom:1px solid #f0d58a;font-size:14px}
#notice.show{display:flex}
#notice span{flex:1}

/* 配置図 */
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#stageWrap{position:relative;flex:1;min-height:0;background:#e9ebee;overflow:hidden}
#stage{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage *{pointer-events:none}
#stage .furn,#stage .furn *,#stage .itm,#stage .itm *{pointer-events:auto}
#app.edit #stage .furn,#app.edit #stage .itm{cursor:move}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
#fab{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fabbtn{min-width:44px;height:44px;padding:0 12px;border:1px solid #b7bcc4;border-radius:22px;background:rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(0,0,0,.2);font-weight:700}
.fabrow{display:flex;gap:8px}
.fabbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
#btnText[aria-pressed="true"],#btnWarn[aria-pressed="true"]{text-decoration:line-through}
#rulerHint{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 220px);padding:6px 10px;border-radius:8px;background:rgba(21,101,192,.92);color:#fff;font-size:14px;pointer-events:none}

/* パネル(スマホ=ボトムシート / PC=サイドパネル) */
#panel{flex:none;display:none;flex-direction:column;background:#fff;border-top:1px solid var(--line);max-height:40vh;max-height:40dvh;min-height:0}
#app.sheet #panel{display:flex}
#app.sheet.tall #panel{max-height:70vh;max-height:70dvh}
#tabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;min-height:44px;border:0;background:none;font-size:15px;border-bottom:3px solid transparent;padding:0 2px}
#tabs button.on{border-bottom-color:var(--blue);color:var(--blue);font-weight:700}
#tabs #closeSheet{flex:none;width:44px;font-size:18px}
#panelBody{flex:1;min-height:0;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}

/* 下部バー */
#bottom{flex:none;display:flex;gap:8px;align-items:center;height:calc(64px + env(safe-area-inset-bottom));padding:0 8px env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line)}
#bottom .btn{flex:1;height:48px}

.btn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid #b7bcc4;border-radius:8px;background:#fff;font-weight:600}
.btn:active{background:#eef1f5}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:#e3a3a3}
.btn[disabled]{opacity:.4;cursor:default}

/* フォーム */
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld>span{font-size:14px;color:var(--sub)}
.fld input,.fld select{width:100%;height:44px;padding:0 10px;border:1px solid #b7bcc4;border-radius:8px;background:#fff;font-size:16px}
.fld input[type=color]{padding:2px 4px}
.full{grid-column:1/-1}
h3{margin:16px 0 8px;font-size:16px}
h3:first-child{margin-top:0}
.card{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fafbfc}
.card+.card{margin-top:8px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:700}
.pads{display:flex;gap:8px;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-auto-rows:44px;gap:8px}
.pad .btn{padding:0;font-size:15px}
.padwrap small{display:block;color:var(--sub);font-size:14px;margin-bottom:2px}
.note{font-size:14px;color:var(--sub)}
.list button.item{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left}
.list button.item+button.item{margin-top:8px}
.chip{flex:none;width:16px;height:16px;border-radius:4px;border:1px solid #888}
.chip.round{border-radius:50%}
.addrow .btn{padding:0 4px;font-size:15px}
.ico{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;text-align:center;line-height:22px}
.ico.red{background:var(--red)}
.ico.yel{background:var(--yel);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);line-height:28px}
.witem.red{border-left:6px solid var(--red)!important}
.witem.yel{border-left:6px solid var(--yel)!important}
.good{color:var(--ok);font-weight:700}
.warnbox{margin-top:8px;padding:8px;border-radius:8px;background:#fff7e0;border:1px solid #f0d58a;font-size:14px}
#selWarn:empty{display:none}
.urlbox{width:100%;height:44px;padding:0 8px;font-size:16px;border:1px solid #b7bcc4;border-radius:8px}
fieldset{border:0;padding:0;margin:0;min-width:0}

#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;padding:10px 16px;border-radius:8px;background:rgba(32,33,36,.92);color:#fff;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.show{opacity:1}

/* 追加ダイアログ */
.seg{display:flex;border:1px solid #b7bcc4;border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;border-right:1px solid #b7bcc4;background:#fff;font-weight:600;padding:0 6px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff}
.seg button[disabled]{opacity:.4;cursor:default}
.preview{display:flex;justify-content:center;padding:6px;border-radius:8px;background:var(--bg)}
#dlg{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4)}
#dlg.show{display:flex}
#dlgCard{width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;background:#fff}

/* 印刷: 画面の操作部品を隠し、#printArea だけを出す */
#printArea{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #app,#toast,#dlg{display:none!important}
  #printArea{display:block;color:#000;font-size:11pt;line-height:1.4}
  #printArea,#printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea h1{margin:0 0 2pt;font-size:16pt}
  #printArea h2{margin:12pt 0 4pt;font-size:12pt;break-after:avoid}
  #printArea .meta{margin:0 0 6pt;font-size:10pt;color:#444}
  #printArea .pplan svg{display:block;width:100%;height:auto;border:1px solid #999}
  #printArea table{width:100%;border-collapse:collapse;font-size:10pt}
  #printArea th,#printArea td{padding:2pt 5pt;border:1px solid #999;text-align:left}
  #printArea th{background:#eee}
  #printArea tr{break-inside:avoid}
  #printArea ul{margin:0;padding-left:1.2em}
}

@media (min-width:768px){
  #dlg{align-items:center}
  #dlgCard{border-radius:16px}
  #main{flex-direction:row}
  #panel{display:flex;width:360px;max-height:none!important;border-top:0;border-left:1px solid var(--line)}
  #closeSheet{display:none}
}
</style>
</head>
<body>
<div id="app" class="edit">
  <header id="top">
    <button id="btnRoom" data-act="openRoom" aria-label="部屋の設定"></button>
    <button id="badge" data-act="openWarn" aria-label="警告一覧"></button>
    <button id="btnMenu" data-act="openMenu" aria-label="メニュー">☰</button>
  </header>
  <div id="notice"><span></span><button class="btn" data-act="startEdit">編集する</button></div>
  <div id="main">
    <div id="stageWrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="部屋の配置図"></svg>
      <div id="rulerHint" hidden>家具をタップすると、壁・他の家具・柱までの距離を表示します</div>
      <div id="fab">
        <div class="fabrow">
          <button class="fabbtn" data-act="zoomOut" aria-label="縮小">−</button>
          <button class="fabbtn" data-act="zoomIn" aria-label="拡大">＋</button>
          <button class="fabbtn" data-act="fit" aria-label="全体表示" title="全体表示">⤢</button>
        </div>
        <div class="fabrow">
          <button class="fabbtn" id="btnRuler" data-act="ruler" aria-pressed="false" aria-label="物差し" title="物差し(距離を表示)">📏</button>
          <button class="fabbtn" id="btnText" data-act="toggleText" aria-pressed="false" aria-label="文字を隠す" title="文字を隠す(一覧表示用)">Aa</button>
          <button class="fabbtn" id="btnWarn" data-act="toggleWarn" aria-pressed="false" aria-label="警告を隠す" title="警告を隠す">⚠</button>
          <button class="fabbtn" data-act="print" aria-label="印刷" title="印刷">🖨</button>
        </div>
      </div>
    </div>
    <aside id="panel" aria-label="編集パネル">
      <div id="tabs"></div>
      <div id="panelBody"></div>
    </aside>
  </div>
  <footer id="bottom">
    <button class="btn" id="btnAdd" data-act="addDlg" data-type="furn" data-shape="rect">＋ 追加</button>
    <button class="btn" id="btnMode" data-act="toggleMode"></button>
    <button class="btn" data-act="openShare">共有</button>
  </footer>
</div>
<div id="dlg" role="dialog" aria-modal="true" aria-label="家具・小物の追加"><div id="dlgCard"></div></div>
<div id="printArea" aria-hidden="true"></div>
<style id="pageStyle"></style>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

/* =====================================================================
 * 定数・ユーティリティ
 * ===================================================================== */
const STORAGE_KEY = 'furniture-checker.v1';
const DEFAULT_SETTINGS = { aisleMin: 60, aisleTight: 45, snap: 5, gapIgnore: 10 };
const EPS = 1e-6;
const MIN_FACE = 20;      // 通路判定: 向かい合う辺がこの長さ以上重なっているときだけ「通路」とみなす
const WINDOW_ZONE = 30;   // 窓の前の判定範囲(奥行き)
const WALL_T = 10;        // 描画上の壁の厚み
const RED = '#d32f2f', YEL = '#e69500', BLUE = '#1565c0';
const WALLS = ['top', 'right', 'bottom', 'left'];
const WALL_LABEL = { top: '上', right: '右', bottom: '下', left: '左' };
const ROUND_N = 48;       // 円・楕円を多角形で近似するときの頂点数(重なり判定用)
const SHAPES = ['rect', 'circle', 'ellipse'];
const SHAPE_LABEL = { rect: '四角形', circle: '円', ellipse: '楕円' };
const SHAPE_OPTS = SHAPES.map((k) => [k, SHAPE_LABEL[k]]);
const PREF_KEY = 'furniture-checker.prefs.v1';

const LIM = {
  'room.width': [50, 3000], 'room.depth': [50, 3000],
  'doors.width': [10, 500], 'windows.width': [10, 1000],
  w: [1, 3000], d: [1, 3000], h: [0, 500], front: [0, 300],
  x: [-1000, 5000], y: [-1000, 5000], offset: [0, 5000], sill: [0, 300],
  aisleMin: [1, 300], aisleTight: [0, 300], snap: [1, 50], gapIgnore: [0, 50],
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (v) => String(Math.round(v * 10) / 10);
const num = (v, def, min = -Infinity, max = Infinity) => {
  v = Number(v);
  return Number.isFinite(v) ? clamp(v, min, max) : def;
};
const str = (v, def) => (typeof v === 'string' && v.trim() !== '' ? v : def);

function box(x, y, w, d) { return { x, y, w, d, x0: x, y0: y, x1: x + w, y1: y + d }; }
function inter(a, b) {
  const x0 = Math.max(a.x0, b.x0), y0 = Math.max(a.y0, b.y0);
  const x1 = Math.min(a.x1, b.x1), y1 = Math.min(a.y1, b.y1);
  return x1 - x0 > EPS && y1 - y0 > EPS ? box(x0, y0, x1 - x0, y1 - y0) : null;
}

/* ---- 円・楕円を含む図形の判定(凸多角形どうしのクリッピング) ---- */
/** o は box() に round フラグが付いたもの。円・楕円は多角形で近似する */
function polyOf(o) {
  if (!o.round) return [{ x: o.x0, y: o.y0 }, { x: o.x1, y: o.y0 }, { x: o.x1, y: o.y1 }, { x: o.x0, y: o.y1 }];
  const cx = (o.x0 + o.x1) / 2, cy = (o.y0 + o.y1) / 2, a = o.w / 2, b = o.d / 2, p = [];
  for (let k = 0; k < ROUND_N; k++) {
    const t = 2 * Math.PI * k / ROUND_N;
    p.push({ x: cx + a * Math.cos(t), y: cy + b * Math.sin(t) });
  }
  return p;
}
function polyArea(p) {
  let s = 0;
  for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; s += p[i].x * q.y - q.x * p[i].y; }
  return s / 2;
}
/** subj を凸多角形 clip で切り抜く(Sutherland–Hodgman) */
function clipPoly(subj, clip) {
  const sg = Math.sign(polyArea(clip)) || 1;
  let out = subj;
  for (let i = 0; i < clip.length && out.length; i++) {
    const a = clip[i], b = clip[(i + 1) % clip.length];
    const side = (p) => sg * ((b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x));
    const inp = out;
    out = [];
    for (let j = 0; j < inp.length; j++) {
      const cur = inp[j], prev = inp[(j + inp.length - 1) % inp.length];
      const dc = side(cur), dp = side(prev);
      if (dc >= 0) {
        if (dp < 0) { const t = dp / (dp - dc); out.push({ x: prev.x + (cur.x - prev.x) * t, y: prev.y + (cur.y - prev.y) * t }); }
        out.push(cur);
      } else if (dp >= 0) {
        const t = dp / (dp - dc);
        out.push({ x: prev.x + (cur.x - prev.x) * t, y: prev.y + (cur.y - prev.y) * t });
      }
    }
  }
  return out;
}
function polyBox(p) {
  const xs = p.map((q) => q.x), ys = p.map((q) => q.y);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  return box(x0, y0, Math.max(...xs) - x0, Math.max(...ys) - y0);
}
/** 2つの図形(四角形 or 円・楕円)が重なっていれば { rect, poly } を返す。poly は円・楕円がからむときだけ */
function shapeInter(a, b) {
  const c = inter(a, b);
  if (!c) return null;
  if (!a.round && !b.round) return { rect: c, poly: null };
  const p = clipPoly(polyOf(a), polyOf(b));
  if (p.length < 3 || Math.abs(polyArea(p)) < 0.05) return null;
  return { rect: polyBox(p), poly: p };
}
const hitShape = (c) => (c.poly ? { poly: c.poly } : c.rect);
/** 描画用: 図形そのものの輪郭(円・楕円なら多角形) */
const outline = (o) => (o.round ? { poly: polyOf(o) } : o);
/** 点が図形の内側か(tol は許容誤差 cm) */
function pointIn(o, px, py, tol = 0) {
  if (!o.round) return px >= o.x0 - tol && px <= o.x1 + tol && py >= o.y0 - tol && py <= o.y1 + tol;
  const a = o.w / 2 + tol, b = o.d / 2 + tol;
  return ((px - (o.x0 + o.x1) / 2) / a) ** 2 + ((py - (o.y0 + o.y1) / 2) / b) ** 2 <= 1 + EPS;
}
/** 図形の外周上の代表点(はみ出し判定用) */
function edgePts(o) {
  const cx = (o.x0 + o.x1) / 2, cy = (o.y0 + o.y1) / 2, a = o.w / 2, b = o.d / 2, p = [];
  if (!o.round) {
    for (const x of [o.x0, cx, o.x1]) for (const y of [o.y0, cy, o.y1]) if (x !== cx || y !== cy) p.push({ x, y });
    return p;
  }
  for (let k = 0; k < 16; k++) { const t = Math.PI * k / 8; p.push({ x: cx + a * Math.cos(t), y: cy + b * Math.sin(t) }); }
  return p;
}
const textW = (s, px) => [...s].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? px : px * 0.58), 0);
function fitText(s, maxW, px) {
  if (textW(s, px) <= maxW) return s;
  let t = [...s];
  while (t.length > 1) {
    t.pop();
    if (textW(t.join('') + '…', px) <= maxW) return t.join('') + '…';
  }
  return '';
}

/* =====================================================================
 * データモデル
 * ===================================================================== */
function sampleData() {
  return {
    version: 1,
    settings: { ...DEFAULT_SETTINGS },
    rooms: [{
      id: 'r1', name: '洋室', width: 360, depth: 270,
      fixtures: [{ id: 'f1', name: '柱', x: 0, y: 0, w: 30, d: 30 }],
      doors: [{ id: 'd1', wall: 'bottom', offset: 20, width: 80, type: 'swing', hinge: 'left', opens: 'in' }],
      windows: [{ id: 'w1', wall: 'top', offset: 100, width: 160, sill: 90 }],
      furniture: [
        { id: 'k1', name: 'ベッド', x: 0, y: 60, w: 100, d: 200, h: 40, rot: 0, front: 0, color: '#8fb3d9', shape: 'rect' },
        { id: 'k2', name: '机', x: 200, y: 0, w: 120, d: 60, h: 72, rot: 0, front: 60, color: '#e0c28f', shape: 'rect' },
        { id: 'k3', name: '丸テーブル', x: 230, y: 130, w: 70, d: 70, h: 60, rot: 0, front: 0, color: '#a8d5a2', shape: 'circle' },
      ],
      // 小物の x,y は「載せる家具(on)の左上」からの相対位置(cm)
      items: [
        { id: 'i1', name: 'ランプ', on: 'k2', x: 10, y: 10, w: 20, d: 20, h: 30, rot: 0, color: '#f2d388', shape: 'circle' },
        { id: 'i2', name: 'PC', on: 'k2', x: 78, y: 15, w: 38, d: 28, h: 3, rot: 0, color: '#c3b1e1', shape: 'rect' },
        { id: 'i3', name: '花瓶', on: 'k3', x: 44, y: 38, w: 16, d: 16, h: 25, rot: 0, color: '#e5a6a6', shape: 'circle' },
      ],
    }],
  };
}
function emptyData(settings) {
  return {
    version: 1, settings: { ...(settings || DEFAULT_SETTINGS) },
    rooms: [{ id: 'r1', name: '新しい部屋', width: 360, depth: 270, fixtures: [], doors: [], windows: [], furniture: [], items: [] }],
  };
}

function uniqIds(arr, prefix, taken) {
  const used = new Set(taken || []);
  let n = 1;
  for (const o of arr) {
    if (!o.id || used.has(o.id)) {
      while (used.has(prefix + n)) n++;
      o.id = prefix + n;
    }
    used.add(o.id);
  }
}

/** 形(shape)を補う。旧データは形の指定がないので四角形。円は縦=横にそろえる */
function withShape(o, shape) {
  o.shape = SHAPES.includes(shape) ? shape : 'rect';
  if (o.shape === 'circle') o.d = o.w;
  return o;
}

/* =====================================================================
 * 状態

const state = {

const view = { s: 1, tx: 0, ty: 0, w: 0, h: 0 };

/* =====================================================================
 * 幾何

const isRound = (o) => o.shape === 'circle' || o.shape === 'ellipse';

const objRect = (o) => (isItem(o) ? iRect(o) : fRect(o));

/** ドアの幾何。hinge:'left' は壁の始点側(左端/上端)、'right' は終点側(右端/下端) */

    case 'right': band = box(W, o, WALL_T, w); start = { x: W, y: o }; u = { x: 0, y: 1 }; n = { x: -1, y: 0 }; break;
    case 'left': band = box(-WALL_T, o, WALL_T, w); start = { x: 0, y: o }; u = { x: 0, y: 1 }; n = { x: 1, y: 0 }; break;

/* =====================================================================
 * チェック判定
 * ===================================================================== */
function computeWarnings() {
  const r = room(), S = state.data.settings, out = [];
  const W = r.width, D = r.depth, roomBox = box(0, 0, W, D);
  const F = r.furniture.map((f) => ({ f, r: fRect(f) }));
  const FX = r.fixtures.map((x) => ({ x, r: box(x.x, x.y, x.w, x.d) }));
  const swings = r.doors
    .map((dr, i) => ({ dr, i, g: doorGeom(r, dr) }))
    .filter((s) => s.dr.type === 'swing' && s.dr.opens === 'in');
  const add = (w) => {
    w.key = `${w.kind}:${w.ids.join('|')}:${Math.round(w.rect.x)},${Math.round(w.rect.y)},${Math.round(w.rect.w)}x${Math.round(w.rect.d)}`;
    out.push(w);
  };

  // 重なり: 壁(はみ出し)
  for (const { f, r: fr } of F) {
    if (fr.x0 < -EPS || fr.y0 < -EPS || fr.x1 > W + EPS || fr.y1 > D + EPS) {
      const shapes = [];
      if (fr.x0 < 0) shapes.push(box(fr.x0, fr.y0, Math.min(0, fr.x1) - fr.x0, fr.d));
      if (fr.x1 > W) shapes.push(box(Math.max(W, fr.x0), fr.y0, fr.x1 - Math.max(W, fr.x0), fr.d));
      if (fr.y0 < 0) shapes.push(box(fr.x0, fr.y0, fr.w, Math.min(0, fr.y1) - fr.y0));
      if (fr.y1 > D) shapes.push(box(fr.x0, Math.max(D, fr.y0), fr.w, fr.y1 - Math.max(D, fr.y0)));
      add({ level: 'red', kind: 'overlap', ids: [f.id], rect: fr, shapes, text: `${f.name}が部屋からはみ出しています` });
    }
  }
  // 重なり: 家具どうし
  for (let i = 0; i < F.length; i++) {
    for (let j = i + 1; j < F.length; j++) {
      const c = shapeInter(F[i].r, F[j].r);
      if (c) add({ level: 'red', kind: 'overlap', ids: [F[i].f.id, F[j].f.id], rect: c.rect, shapes: [hitShape(c)], text: `${F[i].f.name}と${F[j].f.name}が重なっています` });
    }
  }
  // 重なり: 家具と固定物
  for (const a of F) for (const b of FX) {
    const c = shapeInter(a.r, b.r);
    if (c) add({ level: 'red', kind: 'overlap', ids: [a.f.id], rect: c.rect, shapes: [hitShape(c)], text: `${a.f.name}が${b.x.name}と重なっています` });
  }
  // ドア開閉範囲
  for (const s of swings) {
    const bb = sectorBBox(s.g), label = `ドア${s.i + 1}(${WALL_LABEL[s.dr.wall]}の壁)`;
    const shape = { sector: s.g };
    for (const a of F) if (sectorHits(s.g, a.r)) {
      add({ level: 'red', kind: 'door', ids: [a.f.id], rect: bb, shapes: [shape], text: `${label}の開閉範囲に${a.f.name}がかかっています` });
    }
    for (const b of FX) if (sectorHits(s.g, b.r)) {
      add({ level: 'red', kind: 'door', ids: [], rect: bb, shapes: [shape], text: `${label}の開閉範囲に${b.x.name}がかかっています` });
    }
  }
  // 前方スペース
  for (const a of F) {
    const fr = frontRect(a.f);
    if (!fr) continue;
    const causes = [];
    for (const b of F) if (b.f !== a.f && shapeInter(fr, b.r)) causes.push(b.f.name);
    for (const b of FX) if (inter(fr, b.r)) causes.push(b.x.name);
    for (const s of swings) if (sectorHitsRect(s.g, fr)) causes.push(`ドア${s.i + 1}の開閉範囲`);
    if (fr.x0 < -EPS || fr.y0 < -EPS || fr.x1 > W + EPS || fr.y1 > D + EPS) causes.push('壁');
    if (causes.length) {
      add({ level: 'yellow', kind: 'front', ids: [a.f.id], rect: fr, shapes: [fr], text: `${a.f.name}の前方スペース(${fmt(a.f.front)}cm)が${[...new Set(causes)].join('・')}にかかっています` });
    }

  // 窓
  r.windows.forEach((w, i) => {
    const zone = windowZone(r, w);
    for (const a of F) {
      if (!(a.f.h > w.sill)) continue;
      const c = shapeInter(zone, a.r);
      if (c) add({ level: 'yellow', kind: 'window', ids: [a.f.id], rect: c.rect, shapes: [hitShape(c)], text: `${a.f.name}(高さ${fmt(a.f.h)}cm)が窓${i + 1}の前をふさいでいます(窓の下端 ${fmt(w.sill)}cm)` });
    }
    // 家具だけなら窓の下端より低いが、小物を載せると超える場合
    for (const it of r.items) {
      const base = r.furniture.find((f) => f.id === it.on);
      if (!base || base.h > w.sill || !(base.h + it.h > w.sill)) continue;
      const c = shapeInter(zone, iRect(it, r));
      if (c) add({ level: 'yellow', kind: 'window', ids: [it.id], rect: c.rect, shapes: [hitShape(c)], text: `${it.name}(${base.name}の上・床から${fmt(base.h + it.h)}cm)が窓${i + 1}の前をふさいでいます(窓の下端 ${fmt(w.sill)}cm)` });

}

        const ids = [A, B].filter((o) => o.kind === 'furn').map((o) => o.id);
        add({
          level: red ? 'red' : 'yellow', kind: 'aisle', ids, rect: rc, shapes: [rc],
          label: `${fmt(gap)}`,
          text: `${A.name}と${B.name}のすき間 ${fmt(gap)}cm${red ? '(通れません)' : '(横向きでやっと)'}`,
        });
      }
    }
  }
}

function recompute() {
  state.warns = computeWarnings();
  const lv = {};
  for (const w of state.warns) for (const id of w.ids) {
    if (w.level === 'red') lv[id] = 'red';
    else if (!lv[id]) lv[id] = 'yellow';
  }
  state.levels = lv;
}

/* =====================================================================
 * 描画(SVG)
 * ===================================================================== */
let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; draw(); });
}

function T(x, y, s, o = {}) {
  const px = o.px || 12, inv = 1 / view.s;
  const col = o.fill || '#222';
  const halo = o.halo === false ? '' : 'paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;';
  return `<g transform="translate(${x} ${y}) scale(${inv})"><text x="${o.dx || 0}" y="${o.dy || 0}" dy=".35em" text-anchor="${o.anchor || 'middle'}" font-size="${px}" font-weight="${o.bold ? 700 : 400}" fill="${col}" style="${halo}">${esc(s)}</text></g>`;
}
function pill(x, y, s, col) {
  const w = textW(s, 11) + 12;
  return `<g transform="translate(${x} ${y}) scale(${1 / view.s})"><rect x="${-w / 2}" y="-9" width="${w}" height="18" rx="9" fill="${col}" stroke="#fff" stroke-width="1.5"/><text y="0" dy=".35em" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${esc(s)}</text></g>`;
}
function badgeIcon(x, y, level) {
  const inner = level === 'red'
    ? `<circle r="9" fill="${RED}" stroke="#fff" stroke-width="1.5"/><path d="M0 -5V1" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cy="4.5" r="1.3" fill="#fff"/>`
    : `<path d="M0 -10L10 8H-10Z" fill="${YEL}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M0 -3V2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cy="5" r="1.3" fill="#fff"/>`;
  return `<g transform="translate(${x} ${y}) scale(${1 / view.s})">${inner}</g>`;
}

function neighborLines(f) {
  const r = room(), R = fRect(f);
  const all = obstacles(r, f.id).concat(wallBoxes(r));
  const res = [];
  const dirs = [
    { ok: (O) => O.x1 <= R.x0 + EPS, gap: (O) => R.x0 - O.x1, perp: ['y0', 'y1'], mk: (O, m) => [O.x1, m, R.x0, m] },
    { ok: (O) => O.x0 >= R.x1 - EPS, gap: (O) => O.x0 - R.x1, perp: ['y0', 'y1'], mk: (O, m) => [R.x1, m, O.x0, m] },
    { ok: (O) => O.y1 <= R.y0 + EPS, gap: (O) => R.y0 - O.y1, perp: ['x0', 'x1'], mk: (O, m) => [m, O.y1, m, R.y0] },
    { ok: (O) => O.y0 >= R.y1 - EPS, gap: (O) => O.y0 - R.y1, perp: ['x0', 'x1'], mk: (O, m) => [m, R.y1, m, O.y0] },
  ];
  for (const dir of dirs) {
    let best = null;
    for (const O of all) {
      if (!dir.ok(O)) continue;
      const [p0, p1] = dir.perp;
      const lo = Math.max(R[p0], O[p0]), hi = Math.min(R[p1], O[p1]);
      if (hi - lo <= EPS) continue;
      const g = dir.gap(O);
      if (!best || g < best.g) best = { g, m: (lo + hi) / 2, O };
    }
    if (best) res.push({ g: best.g, line: dir.mk(best.O, best.m) });
  }
  return res;
}

function draw() { stage.innerHTML = planMarkup({}); }

/** 配置図の中身(<defs>と<g>)。画面表示と印刷で共用する。印刷時は view を差し替えてから呼ぶ */
function planMarkup(o) {
  const r = room(), s = view.s, inv = 1 / s, W = r.width, D = r.depth;
  const pr = !!o.print, P = o.idp || '', txt = !state.hideText, showW = !state.hideWarn;
  const hatch = (id, col, bg) => `<pattern id="${P}${id}" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="scale(${inv}) rotate(45)"><rect width="8" height="8" fill="${bg}"/><line x1="0" y1="0" x2="0" y2="8" stroke="${col}" stroke-width="3"/></pattern>`;
  let h = `<defs>${hatch('hR', RED, 'rgba(211,47,47,.2)')}${hatch('hY', YEL, 'rgba(230,149,0,.22)')}${hatch('hF', '#8a8f98', '#cfd3d9')}</defs>`;
  h += `<g transform="translate(${view.tx} ${view.ty}) scale(${s})">`;
  const ns = 'vector-effect="non-scaling-stroke"';
  /** 四角形なら rect、円・楕円なら ellipse を返す */
  const shape = (R, attrs) => (R.round
    ? `<ellipse cx="${R.x0 + R.w / 2}" cy="${R.y0 + R.d / 2}" rx="${R.w / 2}" ry="${R.d / 2}" ${attrs}/>`
    : `<rect x="${R.x0}" y="${R.y0}" width="${R.w}" height="${R.d}" ${attrs}/>`);
  const dimText = (obj, R) => (obj.shape === 'circle' ? `φ${fmt(R.w)}` : `${fmt(R.w)}×${fmt(R.d)}`);

  // 床・目盛り
  h += `<rect x="0" y="0" width="${W}" height="${D}" fill="#fff"/>`;
  for (let x = 100; x < W; x += 100) h += `<line x1="${x}" y1="0" x2="${x}" y2="${D}" stroke="#e6e9ee" stroke-width="1" ${ns}/>`;
  for (let y = 100; y < D; y += 100) h += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#e6e9ee" stroke-width="1" ${ns}/>`;
  // 壁
  h += `<path d="M${-WALL_T} ${-WALL_T}H${W + WALL_T}V${D + WALL_T}H${-WALL_T}ZM0 0V${D}H${W}V0Z" fill="#5f6368" fill-rule="evenodd"/>`;
  // 窓
  for (const w of r.windows) {
    const b = windowBand(r, w);
    h += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="#a9d8f0" stroke="#2c7ba3" stroke-width="1.5" ${ns}/>`;
  }
  // ドア
  for (const dr of r.doors) {
    const g = doorGeom(r, dr), b = g.band;
    if (dr.type === 'swing') {
      const sign = dr.opens === 'in' ? 1 : -1;
      const P2 = { x: g.hinge.x + g.n.x * sign * g.r, y: g.hinge.y + g.n.y * sign * g.r };
      if (dr.opens === 'in') h += `<path d="${sectorD(g)}" fill="rgba(160,110,60,.14)" stroke="#a06e3c" stroke-width="1.2" stroke-dasharray="5 4" ${ns}/>`;
      else h += `<path d="${sectorD(g, -1)}" fill="none" stroke="#a06e3c" stroke-width="1" stroke-dasharray="2 4" opacity=".7" ${ns}/>`;
      h += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="#fff" stroke="#a06e3c" stroke-width="1.2" ${ns}/>`;
      h += `<line x1="${g.hinge.x}" y1="${g.hinge.y}" x2="${P2.x}" y2="${P2.y}" stroke="#7a4a1f" stroke-width="3" stroke-linecap="round" ${ns}/>`;
    } else {
      h += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="#efe1c8" stroke="#a06e3c" stroke-width="1.2" ${ns}/>`;
      const cx = b.x + b.w / 2, cy = b.y + b.d / 2, horiz = dr.wall === 'top' || dr.wall === 'bottom';
      h += horiz
        ? `<line x1="${b.x}" y1="${cy}" x2="${b.x1}" y2="${cy}" stroke="#7a4a1f" stroke-width="2" ${ns}/>`
        : `<line x1="${cx}" y1="${b.y}" x2="${cx}" y2="${b.y1}" stroke="#7a4a1f" stroke-width="2" ${ns}/>`;
    }
  }
  // 固定物
  for (const x of r.fixtures) {
    h += `<rect x="${x.x}" y="${x.y}" width="${x.w}" height="${x.d}" fill="url(#${P}hF)" stroke="#6b7078" stroke-width="1.5" ${ns}/>`;
    const nm = fitText(x.name, x.w * s - 4, 11);
    if (txt && x.d * s >= 14 && nm) h += T(x.x + x.w / 2, x.y + x.d / 2, nm, { px: 11, fill: '#333' });
  }
  // 前方スペース
  for (const f of r.furniture) {
    const fr = frontRect(f);
    if (fr) h += `<rect x="${fr.x}" y="${fr.y}" width="${fr.w}" height="${fr.d}" fill="${f.color}" fill-opacity=".28" stroke="${f.color}" stroke-width="1.2" stroke-dasharray="4 3" ${ns}/>`;
  }
  const lvColor = (lv) => (lv === 'red' ? RED : lv === 'yellow' ? YEL : null);
  /** 選択中でラベルが図形内に収まらないときは、図形の上に名前を出す */
  const tag = (R, name) => T(R.x0 + R.w / 2, R.y0 - 11 * inv, name, { px: 12, bold: true, fill: BLUE });

  // 家具(選択中を最前面)
  const sorted = r.furniture.slice().sort((a, b) => (a.id === state.selId) - (b.id === state.selId));
  for (const f of sorted) {
    const R = fRect(f), lv = showW ? state.levels[f.id] : undefined;
    const pw = R.w * s, ph = R.d * s, small = Math.min(pw, ph) < 24;
    h += `<g class="furn" data-furn="${esc(f.id)}">${shape(R, `fill="${f.color}" fill-opacity=".9" stroke="${lvColor(lv) || '#4a4f57'}" stroke-width="${lv ? 3 : 1.5}" ${ns}`)}`;
    if (!small) {
      // 前方向のしるし
      const mid = [{ x: R.x0 + R.w / 2, y: R.y1 }, { x: R.x0, y: R.y0 + R.d / 2 }, { x: R.x0 + R.w / 2, y: R.y0 }, { x: R.x1, y: R.y0 + R.d / 2 }][[0, 90, 180, 270].indexOf(f.rot)];
      h += `<g transform="translate(${mid.x} ${mid.y}) scale(${inv}) rotate(${f.rot})"><path d="M-5 -8L5 -8L0 -1Z" fill="#333" fill-opacity=".7"/></g>`;
    }
    const sel = !pr && f.id === state.selId, k = R.round ? 0.72 : 1;   // 円・楕円は文字を置ける範囲が狭い
    if (txt || sel) {
      const nm = fitText(f.name, pw * k - 8, 12);
      if (nm && ph * k >= 16 && pw * k >= 16) {
        const dims = dimText(f, R);
        const showDims = ph * k >= 38 && textW(dims, 11) <= pw * k - 8;
        h += T(R.x0 + R.w / 2, R.y0 + R.d / 2 - (showDims ? 7 : 0) * inv, nm, { px: 12, bold: true });
        if (showDims) h += T(R.x0 + R.w / 2, R.y0 + R.d / 2 + 8 * inv, dims, { px: 11, fill: '#333' });
      } else if (sel) h += tag(R, f.name);
    }
    if (lv && !small) {
      const bx = R.round ? R.x0 + R.w * 0.5 - R.w * 0.27 : R.x0 + 12 * inv, by = R.round ? R.y0 + R.d * 0.5 - R.d * 0.27 : R.y0 + 12 * inv;
      h += badgeIcon(bx, by, lv);
    }
    h += '</g>';
  }
  // 小物(家具の上に重ねて表示)
  const sortedI = r.items.slice().sort((a, b) => (a.id === state.selId) - (b.id === state.selId));
  for (const it of sortedI) {
    const R = iRect(it, r), lv = showW ? state.levels[it.id] : undefined;
    const pw = R.w * s, ph = R.d * s, cx = R.x0 + R.w / 2, cy = R.y0 + R.d / 2;
    const hw = Math.max(R.w, 30 * inv), hd = Math.max(R.d, 30 * inv);   // 小さい小物も指でつかめるよう、見えない当たり判定を広げる
    h += `<g class="itm" data-item="${esc(it.id)}"><rect x="${cx - hw / 2}" y="${cy - hd / 2}" width="${hw}" height="${hd}" fill="transparent"/>`;
    h += shape(R, `fill="${it.color}" fill-opacity=".96" stroke="${lvColor(lv) || '#5b4a2e'}" stroke-width="${lv ? 3 : 1.5}" ${ns}`);
    const sel = !pr && it.id === state.selId, k = R.round ? 0.72 : 1;
    if (txt || sel) {
      const nm = fitText(it.name, pw * k - 4, 11);
      if (nm && ph * k >= 14 && pw * k >= 14) h += T(cx, cy, nm, { px: 11, bold: true });
      else if (sel) h += tag(R, it.name);
    }
    h += '</g>';
  }
  // 警告の重ね表示(斜線)
  const focus = pr ? null : state.warns.find((w) => w.key === state.focusKey);
  const shownWarns = showW ? state.warns : [];
  for (const w of shownWarns) {
    const fill = `url(#${P}${w.level === 'red' ? 'hR' : 'hY'})`, col = w.level === 'red' ? RED : YEL;
    for (const sh of w.shapes) {
      if (sh.sector) h += `<path d="${sectorD(sh.sector)}" fill="${fill}" stroke="${col}" stroke-width="2" ${ns}/>`;
      else if (sh.poly) h += `<path d="M${sh.poly.map((p) => `${p.x} ${p.y}`).join('L')}Z" fill="${fill}" stroke="${col}" stroke-width="2" ${ns}/>`;
      else h += `<rect x="${sh.x}" y="${sh.y}" width="${sh.w}" height="${sh.d}" fill="${fill}" stroke="${col}" stroke-width="${w.kind === 'front' ? 1.5 : 2}" ${ns}/>`;
    }
  }
  for (const w of shownWarns) {
    const col = w.level === 'red' ? RED : YEL, c = w.rect;
    if (w.kind === 'aisle') h += txt ? pill(c.x + c.w / 2, c.y + c.d / 2, `${w.label}cm`, col) : badgeIcon(c.x + c.w / 2, c.y + c.d / 2, w.level);
    else if (w.kind === 'door') {
      const sh = w.shapes[0].sector;
      h += badgeIcon(sh.hinge.x + (sh.u.x + sh.n.x) * sh.r * 0.55, sh.hinge.y + (sh.u.y + sh.n.y) * sh.r * 0.55, w.level);
    } else h += badgeIcon(c.x + c.w / 2, c.y + c.d / 2, w.level);
  }
  // 選択中の強調・距離表示
  const so = pr ? null : selObj();
  if (so) {
    const R = objRect(so);
    h += shape(R, `fill="none" stroke="${BLUE}" stroke-width="3" stroke-dasharray="7 4" ${ns}`);
    if (!isItem(so) && (state.dragging || state.ruler)) {
      for (const n of neighborLines(so)) {
        const [x1, y1, x2, y2] = n.line;
        if (n.g < 0.05) continue;
        h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${BLUE}" stroke-width="2" ${ns}/>`;
        h += pill((x1 + x2) / 2, (y1 + y2) / 2, `${fmt(n.g)}cm`, BLUE);
      }
    }
  }
  if (focus) {
    const c = focus.rect, p = 6 * inv;
    h += `<rect class="pulse" x="${c.x - p}" y="${c.y - p}" width="${c.w + 2 * p}" height="${c.d + 2 * p}" fill="none" stroke="${BLUE}" stroke-width="3" ${ns}/>`;
  }
  // 部屋寸法
  if (txt) {
    h += T(W / 2, -WALL_T, `${fmt(W)}cm`, { px: 12, dy: -10, bold: true, fill: '#444' });
    h += T(-WALL_T, D / 2, `${fmt(D)}cm`, { px: 12, dx: -8, anchor: 'end', bold: true, fill: '#444' });
  }
  h += '</g>';
  return h;
}

/* =====================================================================
 * 表示(ビュー)制御
 * ===================================================================== */
function stageSize() {
  const b = stage.getBoundingClientRect();
  return { w: b.width, h: b.height };
}
function fitView() {
  const r = room(), { w, h } = stageSize();
  view.w = w; view.h = h;
  if (w < 10 || h < 10) return;
  const mx = 72, my = 60;   // 寸法ラベル(左・上)と余白ぶん
  const s = Math.min((w - mx) / (r.width + 2 * WALL_T), (h - my) / (r.depth + 2 * WALL_T));
  view.s = clamp(s, 0.05, 20);
  view.tx = (w - r.width * view.s) / 2 + 20;
  view.ty = (h - r.depth * view.s) / 2 + 14;
  state.fitMode = true;
  requestRender();
}
function syncSize() {
  const { w, h } = stageSize();
  if (Math.abs(w - view.w) < 1 && Math.abs(h - view.h) < 1) return;
  if (gesture || pinch) { view.w = view.w || w; return; }   // 操作中は保留し、終了時に再計測する
  view.w = w; view.h = h;
  if (state.fitMode) fitView(); else requestRender();
}
function zoomAt(cx, cy, k) {
  const s2 = clamp(view.s * k, 0.05, 20), wx = (cx - view.tx) / view.s, wy = (cy - view.ty) / view.s;
  view.tx = cx - wx * s2; view.ty = cy - wy * s2; view.s = s2;
  state.fitMode = false;
  requestRender();
}
function zoomToRect(rc) {
  const { w, h } = stageSize();
  const tw = Math.max(rc.w * 2.2, 140), th = Math.max(rc.d * 2.2, 140);
  view.s = clamp(Math.min(w / tw, h / th), 0.05, 20);
  view.tx = w / 2 - (rc.x + rc.w / 2) * view.s;
  view.ty = h / 2 - (rc.y + rc.d / 2) * view.s;
  state.fitMode = false;
  requestRender();
}
function ensureVisible(f) {
  const R = objRect(f), pad = 16;
  const l = R.x0 * view.s + view.tx, t = R.y0 * view.s + view.ty, rr = R.x1 * view.s + view.tx, b = R.y1 * view.s + view.ty;
  if (l >= pad && t >= pad && rr <= view.w - pad && b <= view.h - pad) return;
  view.tx = view.w / 2 - (R.x0 + R.w / 2) * view.s;
  view.ty = view.h / 2 - (R.y0 + R.d / 2) * view.s;
  state.fitMode = false;
  requestRender();
}

/* =====================================================================
 * ポインタ操作(ドラッグ・パン・ピンチ・ホイール)
 * ===================================================================== */
const ptrs = new Map();
let gesture = null, pinch = null;

function localPt(e) { const b = stage.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
const snapV = (v) => { const sn = state.data.settings.snap; return Math.round(v / sn) * sn; };

stage.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { stage.setPointerCapture(e.pointerId); } catch (_) { /* noop */ }
  ptrs.set(e.pointerId, localPt(e));
  if (ptrs.size === 2) { startPinch(); return; }
  if (ptrs.size > 2) return;
  const hit = e.target.closest && e.target.closest('[data-furn],[data-item]');
  const g = { id: hit ? (hit.dataset.furn || hit.dataset.item) : null, sx: e.clientX, sy: e.clientY, moved: false, tx0: view.tx, ty0: view.ty };
  if (g.id) {
    const f = findAny(g.id);
    if (!f) return;
    g.ox = f.x; g.oy = f.y; g.item = isItem(f);   // 小物の x,y は載せる家具からの相対位置
    if (state.mode === 'edit') { g.drag = true; }
    if (state.selId !== g.id) select(g.id, { fromStage: true });
  }
  gesture = g;
});

stage.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, localPt(e));
  if (pinch) { updatePinch(); return; }
  const g = gesture;
  if (!g) return;
  const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
  if (!g.moved && Math.hypot(dx, dy) < 4) return;
  g.moved = true;
  if (g.drag) {
    const f = findAny(g.id), r = room();
    if (g.item) {
      // 小物は細かく置きたいので 1cm 単位。絶対位置で部屋の外に出すぎないよう制限してから相対位置に戻す
      const b = r.furniture.find((o) => o.id === f.on), R = iRect(f, r);
      f.x = clamp(Math.round(g.ox + dx / view.s), -200 - b.x, r.width + 200 - R.w - b.x);
      f.y = clamp(Math.round(g.oy + dy / view.s), -200 - b.y, r.depth + 200 - R.d - b.y);
    } else {
      const R = fRect(f);
      f.x = clamp(snapV(g.ox + dx / view.s), -200, r.width + 200 - R.w);
      f.y = clamp(snapV(g.oy + dy / view.s), -200, r.depth + 200 - R.d);
    }
    state.dragging = true;
    changed({ panel: 'sync' });
  } else {
    view.tx = g.tx0 + dx; view.ty = g.ty0 + dy;
    state.fitMode = false;
    requestRender();
  }
});

function endPointer(e) {
  const had = ptrs.delete(e.pointerId);
  if (!had) return;
  if (pinch) { if (ptrs.size < 2) pinch = null; gesture = null; syncSize(); return; }
  const g = gesture;
  gesture = null;
  if (!g) return;
  state.dragging = false;
  if (!g.moved && !g.id) deselect();
  if (g.moved && g.drag) {
    if (g.item) { dropItem(findI(g.id)); changed({ panel: 'full' }); }
    else changed({ panel: 'sync' });
  }
  requestRender();
  syncSize();
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('lostpointercapture', endPointer);

function startPinch() {
  if (gesture && gesture.drag && gesture.moved) {   // ドラッグ途中で2本目の指が触れたら元の位置に戻す
    const f = findAny(gesture.id);
    if (f) { f.x = gesture.ox; f.y = gesture.oy; }
  }
  gesture = null; state.dragging = false;
  const [a, b] = [...ptrs.values()];
  const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  pinch = { d0: d, s0: view.s, wx: (c.x - view.tx) / view.s, wy: (c.y - view.ty) / view.s };
  changed({ panel: 'sync' });
}
function updatePinch() {
  const [a, b] = [...ptrs.values()];
  const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  view.s = clamp(pinch.s0 * d / pinch.d0, 0.05, 20);
  view.tx = c.x - pinch.wx * view.s; view.ty = c.y - pinch.wy * view.s;
  state.fitMode = false;
  requestRender();
}
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const p = localPt(e);
  zoomAt(p.x, p.y, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));

function select(id, o = {}) {
  state.selId = id;
  state.focusKey = null;
  state.tab = 'furn';
  state.sheet = true;
  updateChrome();
  renderPanel();
  syncSize();
  if (!o.fromStage) { const f = findAny(id); if (f) ensureVisible(f); }
  requestRender();
}
function deselect() {
  if (!state.selId && !state.focusKey) return;
  state.selId = null; state.focusKey = null;
  if (state.tab === 'furn') state.sheet = false;
  updateChrome(); renderPanel(); syncSize(); requestRender();
}
function nextId(arr, prefix) {
  let n = 1;
  const used = new Set(arr.map((o) => o.id));
  while (used.has(prefix + n)) n++;
  return prefix + n;
}
function freeSpot(w, d) {
  const r = room(), obs = obstacles(r).map((o) => box(o.x0, o.y0, o.w, o.d));
  for (let y = 0; y + d <= r.depth; y += 10) for (let x = 0; x + w <= r.width; x += 10) {
    const c = box(x, y, w, d);
    if (!obs.some((o) => inter(o, c))) return { x, y };
  }
  return { x: 0, y: 0 };
}
const FURN_COLORS = ['#8fb3d9', '#e0c28f', '#a8d5a2', '#e5a6a6', '#c3b1e1', '#f2d388'];
const ITEM_COLORS = ['#f2a65a', '#9fd3c7', '#f7d6e0', '#d7ccc8', '#b8d8f0', '#e6e08a'];

/** 小物を、その中心がある家具に載せ替える(ドロップ時)。どの家具の上にもなければ今の家具のまま */
function dropItem(it) {
  if (!it) return;
  const r = room(), R = iRect(it, r), cx = R.x0 + R.w / 2, cy = R.y0 + R.d / 2;
  const cur = r.furniture.find((f) => f.id === it.on);
  if (cur && pointIn(fRect(cur), cx, cy)) return;
  const area = (f) => { const q = fRect(f); return q.w * q.d; };
  const cand = r.furniture.filter((f) => pointIn(fRect(f), cx, cy)).sort((a, b) => area(a) - area(b))[0];
  if (cand) { it.on = cand.id; it.x = round1(R.x0 - cand.x); it.y = round1(R.y0 - cand.y); }
}
/** 載せる家具を変更し、新しい家具の真ん中に置く */
function moveItemTo(it, fid) {
  const r = room(), nb = r.furniture.find((f) => f.id === fid);
  if (!nb) return;
  const N = fRect(nb), I = iRect({ ...it, on: fid }, r);
  it.on = fid;
  it.x = round1((N.w - I.w) / 2); it.y = round1((N.d - I.d) / 2);
}

/* ---- 追加ダイアログ(家具・小物の形と縦横のcmをここで決める) ---- */
const dlgEl = $('#dlg'), dlgCard = $('#dlgCard');
const dlg = { type: 'furn', shape: 'rect', name: '', w: 60, d: 60, h: 60, on: '', nameDirty: false, sizeDirty: false };
function dlgDefaults() {
  if (dlg.type === 'item') return { rect: [20, 15, 15], circle: [20, 20, 15], ellipse: [25, 15, 15] }[dlg.shape];
  return { rect: [60, 60, 60], circle: [90, 90, 70], ellipse: [120, 80, 70] }[dlg.shape];
}
/** ダイアログの寸法(cm)。空欄なら既定値を使う(Number('') は 0 になるので先に判定する)。i は dlgDefaults の位置 */
const dlgSize = (k, i) => round1(num(String(dlg[k]).trim() === '' ? NaN : dlg[k], dlgDefaults()[i], ...LIM[k]));
const dlgDefaultName = () => (dlg.type === 'item' ? '小物' : { rect: '家具', circle: '丸テーブル', ellipse: '楕円テーブル' }[dlg.shape]);
function openDlg(type, shape, on) {
  if (state.mode !== 'edit') return;
  const r = room();
  if (type === 'item' && !r.furniture.length) { toast('小物は家具の上に置きます。先に家具を追加してください'); return; }

    type, shape: shape || 'rect', nameDirty: false, sizeDirty: false,
    on: on || (cur ? (isItem(cur) ? cur.on : cur.id) : '') || (r.furniture[0] ? r.furniture[0].id : ''),   // 家具0件(空の部屋)でも開けるように
  });

}
function closeDlg() { dlgEl.classList.remove('show'); }
function applyDlgDefaults() {
  if (!dlg.nameDirty) dlg.name = dlgDefaultName();
  if (!dlg.sizeDirty) [dlg.w, dlg.d, dlg.h] = dlgDefaults();
  if (dlg.shape === 'circle') dlg.d = dlg.w;
}
function dlgPreview() {
  const w = dlgSize('w', 0), d = dlg.shape === 'circle' ? w : dlgSize('d', 1);
  const k = Math.min(150 / w, 66 / d), pw = w * k, ph = d * k;
  const at = `x="${100 - pw / 2}" y="${40 - ph / 2}" width="${pw}" height="${ph}"`;
  const body = dlg.shape === 'rect'
    ? `<rect ${at} rx="2" fill="#cfe0f3" stroke="#4a4f57" stroke-width="1.5"/>`
    : `<ellipse cx="100" cy="40" rx="${pw / 2}" ry="${ph / 2}" fill="#cfe0f3" stroke="#4a4f57" stroke-width="1.5"/>`;
  const cap = dlg.shape === 'circle' ? `直径 ${fmt(w)} cm` : `横 ${fmt(w)} × 縦 ${fmt(d)} cm`;
  return `<svg viewBox="0 0 200 100" width="200" height="100" role="img" aria-label="形のプレビュー">${body}<text x="100" y="94" text-anchor="middle" font-size="13" fill="#222">${cap}</text></svg>`;
}
function renderDlg() {
  const r = room(), item = dlg.type === 'item', circle = dlg.shape === 'circle';
  const inp = (label, key, val) => `<label class="fld"><span>${label}</span><input type="number" inputmode="decimal" step="any" data-dk="${key}" value="${esc(val)}" autocomplete="off"></label>`;
  dlgCard.innerHTML = `<div class="stack">

    </div>
    <div class="seg" role="group" aria-label="形">${SHAPES.map((k) => `<button data-ds="${k}" class="${dlg.shape === k ? 'on' : ''}">${SHAPE_LABEL[k]}</button>`).join('')}</div>
    <div class="preview" id="dlgPrev">${dlgPreview()}</div>
    <label class="fld"><span>名前</span><input type="text" id="dlgName" data-dk="name" value="${esc(dlg.name)}" autocomplete="off"></label>
    <div class="grid2">
      ${circle ? inp('直径 (cm)', 'w', dlg.w) : inp('横・幅 (cm)', 'w', dlg.w) + inp('縦・奥行き (cm)', 'd', dlg.d)}
      ${inp('高さ (cm)', 'h', dlg.h)}
    </div>
    ${circle ? '' : '<p class="note" style="margin:0">楕円は横と縦の長さを変えて作ります(同じ値なら円)。</p>'}
    ${item ? `<label class="fld"><span>載せる家具</span><select data-dk="on">${r.furniture.map((f) => `<option value="${esc(f.id)}" ${f.id === dlg.on ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select></label>` : ''}

}
dlgCard.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.dk;

  if (k === 'name') { dlg.name = e.target.value; dlg.nameDirty = true; return; }

function createFromDlg() {
  if (state.mode !== 'edit') return;
  const r = room(), circle = dlg.shape === 'circle', item = dlg.type === 'item';
  const w = dlgSize('w', 0), d = circle ? w : dlgSize('d', 1), h = dlgSize('h', 2);
  const name = dlg.name.trim() || dlgDefaultName();
  closeDlg();
  let o;
  if (item) {
    const base = r.furniture.find((f) => f.id === dlg.on);
    if (!base) return;
    const N = fRect(base);
    o = { id: nextId(r.items, 'i'), name, on: base.id, x: round1((N.w - w) / 2), y: round1((N.d - d) / 2), w, d, h, rot: 0, color: ITEM_COLORS[r.items.length % ITEM_COLORS.length], shape: dlg.shape };
    r.items.push(o);
  } else {
    const p = freeSpot(w, d);
    o = { id: nextId(r.furniture, 'k'), name, x: p.x, y: p.y, w, d, h, rot: 0, front: 0, color: FURN_COLORS[r.furniture.length % FURN_COLORS.length], shape: dlg.shape };
    r.furniture.push(o);

}

function rotateSel() {
  const o = selObj();
  if (!o || state.mode !== 'edit') return;
  const r = room();
  if (isItem(o)) {   // 小物はその場で回す
    const R = iRect(o, r), cx = R.x0 + R.w / 2, cy = R.y0 + R.d / 2;
    o.rot = (o.rot + 90) % 360;
    const N = iRect(o, r);
    o.x = round1(o.x + cx - (N.x0 + N.w / 2)); o.y = round1(o.y + cy - (N.y0 + N.d / 2));
    changed({ panel: 'full' });
    return;
  }
  const f = o, R = fRect(f), cx = R.x0 + R.w / 2, cy = R.y0 + R.d / 2;
  // 載っている小物も一緒に回す(家具の中心まわりに時計回りに90度)
  const kids = itemsOn(f.id).map((it) => { const k = iRect(it, r); return { it, dx: k.x0 + k.w / 2 - cx, dy: k.y0 + k.d / 2 - cy }; });
  f.rot = (f.rot + 90) % 360;
  const N = fRect(f);
  f.x = Math.round(cx - N.w / 2); f.y = Math.round(cy - N.d / 2);
  if (N.w <= r.width) f.x = clamp(f.x, 0, r.width - N.w);
  if (N.d <= r.depth) f.y = clamp(f.y, 0, r.depth - N.d);
  const mx = f.x + N.w / 2, my = f.y + N.d / 2;
  for (const { it, dx, dy } of kids) {
    it.rot = (it.rot + 90) % 360;
    const K = iRect(it, r);
    it.x = round1(mx - dy - K.w / 2 - f.x); it.y = round1(my + dx - K.d / 2 - f.y);
  }
  changed({ panel: 'full' });
}
function duplicateSel() {
  const o = selObj(), r = room();
  if (!o || state.mode !== 'edit') return;
  if (isItem(o)) {
    const c = { ...o, id: nextId(r.items, 'i'), name: o.name + '(コピー)', x: o.x + 10, y: o.y + 10 };
    r.items.push(c);
    changed({ panel: 'none' });
    select(c.id);
    return;
  }
  const c = { ...o, id: nextId(r.furniture, 'k'), name: o.name + '(コピー)', x: o.x + 20, y: o.y + 20 };
  r.furniture.push(c);
  for (const it of itemsOn(o.id)) r.items.push({ ...it, id: nextId(r.items, 'i'), on: c.id });
  changed({ panel: 'none' });
  select(c.id);
}
function deleteSel() {
  const o = selObj(), r = room();
  if (!o || state.mode !== 'edit') return;
  const kids = isItem(o) ? [] : itemsOn(o.id);
  if (!confirm(kids.length ? `「${o.name}」と、載っている小物 ${kids.length} 個を削除しますか?` : `「${o.name}」を削除しますか?`)) return;
  if (isItem(o)) r.items = r.items.filter((i) => i.id !== o.id);
  else {
    r.furniture = r.furniture.filter((f) => f.id !== o.id);
    r.items = r.items.filter((i) => i.on !== o.id);
  }
  state.selId = null;

/* ---- 入力欄の反映 ---- */
function lookup(col, id) {
  const r = room();
  if (col === 'room') return r;
  if (col === 'settings') return state.data.settings;
  return (r[col] || []).find((o) => o.id === id);
}
/** ドア・窓を壁の長さに収める。部屋を縮めたときに使う。変更があれば true */
function fitOpenings(r) {
  let moved = false;
  for (const o of [...r.doors, ...r.windows]) {
    const len = wallLen(r, o.wall), width = Math.min(o.width, len), offset = clamp(o.offset, 0, Math.max(0, len - width));
    if (width !== o.width || offset !== o.offset) { o.width = width; o.offset = offset; moved = true; }
  }
  return moved;
}
function applyField(t, commit) {
  if (state.mode !== 'edit') return;
  const { col, id, key } = t.dataset;
  const obj = lookup(col, id);
  if (!obj) return;
  if (t.type === 'number') {
    let v = parseFloat(t.value);
    if (!Number.isFinite(v)) { if (commit) t.value = obj[key]; return; }
    const [a, b] = LIM[col + '.' + key] || LIM[key] || [-1e6, 1e6];
    obj[key] = clamp(v, a, b);
  } else if (col === 'items' && key === 'on') {
    moveItemTo(obj, t.value);
  } else {
    obj[key] = t.value;
    if (key === 'name' && !t.value.trim()) obj[key] = '';
  }
  let rerender = false;
  if ((col === 'furniture' || col === 'items') && (key === 'shape' || (key === 'w' && obj.shape === 'circle'))) {
    if (obj.shape === 'circle') obj.d = obj.w;   // 円は縦=横
    if (key === 'shape') rerender = true;         // 形が変わると入力欄の構成も変わる
  }
  if (col === 'items' && key === 'on') rerender = true;
  if ((col === 'doors' || col === 'windows') && (commit || t.tagName === 'SELECT') && ['offset', 'width', 'wall'].includes(key)) {
    const len = wallLen(room(), obj.wall);
    obj.width = Math.min(obj.width, len);
    const off = clamp(obj.offset, 0, Math.max(0, len - obj.width));
    if (off !== obj.offset) { obj.offset = off; rerender = true; }
  }
  if (col === 'room') {
    if (key === 'name') updateChrome();
    else {
      if (commit && fitOpenings(obj)) rerender = true;   // 入力途中の値では動かさず、確定時だけ収める
      fitView();
    }
  }
  if (col === 'settings' && commit && key === 'aisleTight' && obj.aisleTight > obj.aisleMin) { obj.aisleMin = obj.aisleTight; rerender = true; }
  changed({ panel: 'none' });
  if (commit && t.type === 'number' && !rerender) t.value = obj[key];
  if (rerender) renderPanel();
}
panelBody.addEventListener('input', (e) => { if (e.target.dataset && e.target.dataset.col) applyField(e.target, false); });
panelBody.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.col) applyField(e.target, true); });

/* =====================================================================
 * 保存(localStorage / JSON / URL共有)
 * ===================================================================== */
let saveTimer = null;
function readLocalRaw() { try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; } }
function saveNow() {
  clearTimeout(saveTimer);
  if (state.locked) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (_) { /* 容量超過・プライベートモード等 */ }
}
function scheduleSave() {
  if (state.locked) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 250);
}
function loadLocal() {
  const raw = readLocalRaw();
  if (!raw) return null;
  try { return normalize(JSON.parse(raw)); } catch (_) { return null; }
}

function b64url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64url(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function pipeBytes(bytes, stream) {
  const w = stream.writable.getWriter();
  w.write(bytes); w.close();
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}
async function encodeShare(data) {
  if (typeof CompressionStream === 'undefined') throw new Error('このブラウザは圧縮に対応していません');
  const z = await pipeBytes(new TextEncoder().encode(JSON.stringify(data)), new CompressionStream('deflate-raw'));
  return 'v1.' + b64url(z);
}
async function decodeShare(code) {
  if (!code.startsWith('v1.')) throw new Error('未対応の形式です');
  if (typeof DecompressionStream === 'undefined') throw new Error('このブラウザは展開に対応していません');
  const raw = await pipeBytes(unb64url(code.slice(3)), new DecompressionStream('deflate-raw'));
  return normalize(JSON.parse(new TextDecoder().decode(raw)));
}
async function shareUrl() {
  const base = location.href.split('#')[0];
  return base + '#' + await encodeShare(state.data);
}

let shareTimer = null;
function scheduleShareInfo() { clearTimeout(shareTimer); shareTimer = setTimeout(updateShareInfo, 300); }
async function updateShareInfo() {
  const el = $('#shareInfo');
  if (!el) return;
  try {
    const url = await shareUrl();
    const el2 = $('#shareInfo');
    if (!el2) return;
    const n = url.length;
    el2.innerHTML = `URLの長さ: <b>${n.toLocaleString()}</b> 文字` + (n > 2000 ? '<div class="warnbox">⚠ 2,000文字を超えています。LINEやメールなど一部のアプリで、リンクが途中で切れることがあります。長い場合はJSONファイルでの共有も使ってください。</div>' : '');
  } catch (e) {
    const el2 = $('#shareInfo');
    if (el2) el2.textContent = '共有リンクを作れません: ' + e.message;
  }
}
async function copyLink() {
  try {
    const url = await shareUrl();
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (_) { /* フォールバックへ */ }
    const box = $('#shareUrl');
    if (box) { box.hidden = false; box.value = url; if (!ok) { box.focus(); box.select(); try { ok = document.execCommand('copy'); } catch (_) { /* noop */ } } }
    toast(ok ? '共有リンクをコピーしました' : 'コピーできませんでした。下の欄から手動でコピーしてください');
  } catch (e) { toast('共有リンクを作れません: ' + e.message); }
}
function exportJson() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `layout-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importJsonFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = normalize(JSON.parse(fr.result));
      if (!confirm('現在の配置を、読み込んだファイルの内容で置き換えますか?')) return;
      replaceData(data);
      toast('読み込みました');
    } catch (e) { toast('読み込めませんでした: ' + e.message); }
  };
  fr.onerror = () => toast('ファイルを読めませんでした');
  fr.readAsText(file);
}
function replaceData(data) {
  state.data = data;
  state.selId = null; state.focusKey = null;
  if (state.tab === 'furn') state.sheet = false;
  recompute();
  updateChrome();
  renderPanel();
  syncSize();
  fitView();
  scheduleSave();
}

/** 印刷用の配置図。画面の拡大縮小とは無関係に、部屋全体が収まる大きさで描き直す */
function printSvg(landscape) {
  const r = room(), W = r.width, D = r.depth;
  const vwMax = landscape ? 1000 : 700, vhMax = landscape ? 520 : 720;
  const s = clamp(Math.min((vwMax - 56 - 16) / (W + 2 * WALL_T), (vhMax - 22 - 12) / (D + 2 * WALL_T)), 0.05, 20);
  const tx = 56 + WALL_T * s, ty = 22 + WALL_T * s;
  const vw = tx + (W + WALL_T) * s + 16, vh = ty + (D + WALL_T) * s + 12;
  const keep = { ...view };
  Object.assign(view, { s, tx, ty, w: vw, h: vh });   // T() などが view.s を参照するため一時的に差し替える
  try {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vw} ${vh}" role="img" aria-label="部屋の配置図">${planMarkup({ print: true, idp: 'p_' })}</svg>`;
  } finally { Object.assign(view, keep); }
}
function buildPrint() {
  const r = room(), landscape = r.width > r.depth * 1.15, d = new Date();
  $('#pageStyle').textContent = `@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:10mm}`;
  const sizeOf = (o) => (o.shape === 'circle' ? `直径 ${fmt(o.w)}` : `${fmt(o.w)} × ${fmt(o.d)}`);
  const furnRows = r.furniture.map((f) => `<tr><td>${esc(f.name)}</td><td>${SHAPE_LABEL[f.shape]}</td><td>${sizeOf(f)}</td><td>${fmt(f.h)}</td><td>${f.front > 0 ? fmt(f.front) : '-'}</td><td>${fmt(f.x)}, ${fmt(f.y)}</td></tr>`).join('');
  const itemRows = r.items.map((i) => {
    const b = r.furniture.find((f) => f.id === i.on);
    return `<tr><td>${esc(i.name)}</td><td>${b ? esc(b.name) : ''}</td><td>${SHAPE_LABEL[i.shape]}</td><td>${sizeOf(i)}</td><td>${fmt(i.h)}</td></tr>`;
  }).join('');
  const warns = state.warns.map((w) => `<li>${w.level === 'red' ? '✕ ' : '▲ '}${esc(w.text)}</li>`).join('');
  $('#printArea').innerHTML = `
    <h1>${esc(r.name)}</h1>
    <p class="meta">部屋 ${fmt(r.width)} × ${fmt(r.depth)} cm ／ ${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 印刷 ／ 判定: 赤 ${state.warns.filter((w) => w.level === 'red').length} 件・黄 ${state.warns.filter((w) => w.level !== 'red').length} 件</p>
    <div class="pplan">${printSvg(landscape).replace('<svg ', `<svg style="max-height:${landscape ? 125 : 165}mm" `)}</div>
    <h2>家具(単位 cm)</h2>
    ${furnRows ? `<table><thead><tr><th>名前</th><th>形</th><th>横 × 縦</th><th>高さ</th><th>前方</th><th>位置 X, Y</th></tr></thead><tbody>${furnRows}</tbody></table>` : '<p>なし</p>'}
    ${itemRows ? `<h2>小物(単位 cm)</h2><table><thead><tr><th>名前</th><th>載せる家具</th><th>形</th><th>横 × 縦</th><th>高さ</th></tr></thead><tbody>${itemRows}</tbody></table>` : ''}
    <h2>チェック結果</h2>
    ${warns ? `<ul>${warns}</ul>` : '<p>問題は見つかりませんでした。</p>'}`;
}
function printNow() {
  buildPrint();
  window.print();
}
window.addEventListener('beforeprint', buildPrint);   // ブラウザのメニューや Ctrl+P から印刷した場合にも最新の内容にする

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* =====================================================================
 * クリック操作(イベント委譲)
 * ===================================================================== */
document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { openTab(tabBtn.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const d = b.dataset, r = room();
  switch (d.act) {
    case 'openRoom': openTab('room'); break;
    case 'openWarn': openTab('warn'); break;
    case 'openMenu':
      if (state.sheet && matchMedia('(max-width:767px)').matches) { state.sheet = false; renderPanel(); syncSize(); } else openTab(state.tab === 'furn' && !selObj() ? 'room' : state.tab);
      break;
    case 'openShare': openTab('file'); break;
    case 'closeSheet': state.sheet = false; if (state.tab === 'furn') state.selId = null; updateChrome(); renderPanel(); syncSize(); requestRender(); break;
    case 'startEdit': setMode('edit'); break;
    case 'toggleMode': setMode(state.mode === 'edit' ? 'view' : 'edit'); break;
    case 'ruler': state.ruler = !state.ruler; updateChrome(); requestRender(); break;
    case 'fit': fitView(); break;
    case 'zoomIn': zoomAt(view.w / 2, view.h / 2, 1.3); break;
    case 'zoomOut': zoomAt(view.w / 2, view.h / 2, 1 / 1.3); break;
    case 'addDlg': openDlg(d.type, d.shape, d.on); break;
    case 'dlgOk': createFromDlg(); break;
    case 'dlgCancel': closeDlg(); break;
    case 'toggleText': setHideText(!state.hideText); break;
    case 'toggleWarn': setHideWarn(!state.hideWarn); break;
    case 'print': printNow(); break;
    case 'selectFurn': select(d.id); break;
    case 'deselect': deselect(); break;
    case 'rot': rotateSel(); break;
    case 'dup': duplicateSel(); break;
    case 'del': deleteSel(); break;
    case 'nudge': nudge(Number(d.dx), Number(d.dy)); break;
    case 'focusWarn': {
      const w = state.warns.find((o) => o.key === d.key);
      if (w) { state.focusKey = w.key; zoomToRect(w.rect); }
      break;
    }
    case 'addFixture': r.fixtures.push({ id: nextId(r.fixtures, 'f'), name: '出っ張り', x: 0, y: 0, w: 30, d: 30 }); changed({ panel: 'full' }); break;
    case 'addDoor': r.doors.push({ id: nextId(r.doors, 'd'), wall: 'bottom', offset: Math.min(20, Math.max(0, r.width - 80)), width: 80, type: 'swing', hinge: 'left', opens: 'in' }); changed({ panel: 'full' }); break;
    case 'addWindow': r.windows.push({ id: nextId(r.windows, 'w'), wall: 'top', offset: Math.min(100, Math.max(0, r.width - 100)), width: Math.min(160, r.width), sill: 90 }); changed({ panel: 'full' }); break;
    case 'delItem': {
      r[d.col] = r[d.col].filter((o) => o.id !== d.id);
      changed({ panel: 'full' });
      break;
    }
    case 'copyLink': copyLink(); break;
    case 'exportJson': exportJson(); break;
    case 'importJson': $('#fileIn').click(); break;
    case 'newRoom': if (confirm('すべての配置を消して、空の部屋にしますか?(判定の設定は残ります)')) replaceData(emptyData(state.data.settings)); break;
    case 'sample': if (confirm('現在の配置を消して、サンプルに戻しますか?')) replaceData(sampleData()); break;
  }
});
$('#fileIn').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) importJsonFile(f);
});

document.addEventListener('keydown', (e) => {
  if (dlgEl.classList.contains('show')) {
    if (e.key === 'Escape') closeDlg();
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); createFromDlg(); }   // 日本語入力の確定Enterでは追加しない(229はSafari対策)
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  const f = selObj();
  if (!f || state.mode !== 'edit') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // Ctrl+R(再読み込み)などブラウザのショートカットを横取りしない
  const n = e.shiftKey ? 10 : 1;
  switch (e.key) {
    case 'ArrowLeft': nudge(-n, 0); break;
    case 'ArrowRight': nudge(n, 0); break;
    case 'ArrowUp': nudge(0, -n); break;
    case 'ArrowDown': nudge(0, n); break;
    case 'Delete': case 'Backspace': deleteSel(); break;
    case 'r': case 'R': rotateSel(); break;
    case 'Escape': deselect(); break;
    default: return;
  }
  e.preventDefault();
});

window.addEventListener('hashchange', () => { if (location.hash.length > 1) loadFromHash(); });
window.addEventListener('pagehide', saveNow);

/* =====================================================================
 * 起動
 * ===================================================================== */
async function loadFromHash() {
  try {
    const data = await decodeShare(location.hash.slice(1));
    state.data = data;
    state.locked = true; state.mode = 'view';
    state.selId = null; state.focusKey = null; state.sheet = false;
    recompute(); updateChrome(); renderPanel(); syncSize(); fitView();
    return true;
  } catch (e) {
    toast('共有リンクを読み込めませんでした: ' + e.message);
    return false;
  }
}

async function boot() {
  loadPrefs();
  state.data = loadLocal() || sampleData();
  recompute();
  updateChrome();
  renderPanel();
  const { w, h } = stageSize();
  view.w = w; view.h = h;
  fitView();
  if (location.hash.length > 1) await loadFromHash();
  window.__app = { state, view, room, computeWarnings, fitView, normalize };   // 動作確認用
}
boot();
})();
</script>
</body>
