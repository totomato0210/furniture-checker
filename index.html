/* ---- 入力欄の反映 ---- */
function lookup(col, id) {
  const r = room();
  if (col === 'room') return r;
  if (col === 'settings') return state.data.settings;
  return (r[col] || []).find((o) => o.id === id);
}
/** ドア・窓を壁(辺)の長さに収める。部屋を縮めたときに使う。変更があれば true */
function fitOpenings(r) {
  let moved = false;
  for (const o of [...r.doors, ...r.windows]) {
    const len = openingEdge(r, o).len, width = Math.min(o.width, len), offset = clamp(o.offset, 0, Math.max(0, len - width));
    if (width !== o.width || offset !== o.offset) { o.width = width; o.offset = offset; moved = true; }
  }
  return moved;
}
/** 形を変える前に、各ドア・窓の両端の絶対座標(p0 が始点側)とヒンジ側の端を控える */
function openingSnap(r) {
  return [...r.doors, ...r.windows].map((o) => {
    const e = openingEdge(r, o);
    const p0 = { x: e.a.x + e.u.x * o.offset, y: e.a.y + e.u.y * o.offset };
    const p1 = { x: p0.x + e.u.x * o.width, y: p0.y + e.u.y * o.width };
    return { o, p0, p1, hingeAt0: o.hinge !== 'right', edge: isPoly(r) ? o.edge : null };
  });
}
/**
 * 形を変えたあと、控え(openingSnap)をもとにドア・窓を新しい辺(壁)へ付け替える。
 * km = { ks, nOld }(設計モードの完了時): 新しい辺の両端が元の頂点 j と j+1 なら、元の辺 j のドア・窓はその辺に残す(ヒンジは保ち、位置は射影で決める)。
 * それ以外は位置で決める: 区間の中点にいちばん近い辺を選び、両端をその辺に射影する。
 * 中点から辺までが 1cm を超えた、または幅を縮めたものがあれば true(呼び出し側で確認を促す)
 */
function remapOpenings(r, snap, km) {
  const poly = isPoly(r);
  const cands = poly
    ? roomEdges(r).map((e, i) => ({ a: e.a, u: e.u, len: e.len, edge: i }))
    : WALLS.map((w) => ({ ...openingEdge(r, { wall: w }), wall: w }));
  const setTo = (o, c) => {
    if (poly) { o.edge = c.edge; delete o.wall; } else { o.wall = c.wall; delete o.edge; }
  };
  let warn = false;
  for (const s of snap) {
    const o = s.o;
    if (km && poly && s.edge != null) {
      const n = km.ks.length, j1 = (s.edge + 1) % km.nOld;
      const i = km.ks.findIndex((k, ii) => k === s.edge && km.ks[(ii + 1) % n] === j1);
      if (i >= 0) {
        // 同じ辺に残す。位置は元の始点側の端を辺に射影して決める(辺の始点の角が動いても、部屋の中での位置がずれない)。ヒンジは変えない
        const c = cands[i], w = Math.min(o.width, c.len);
        if (w < o.width - EPS) warn = true;
        setTo(o, c);
        o.width = w; o.offset = clamp(round1(projT(c, s.p0)), 0, Math.max(0, c.len - w));
        continue;
      }
    }
    const m = { x: (s.p0.x + s.p1.x) / 2, y: (s.p0.y + s.p1.y) / 2 };
    let best = null, bd = Infinity;
    for (const c of cands) {
      const d = segDist(m, c.a, { x: c.a.x + c.u.x * c.len, y: c.a.y + c.u.y * c.len });
      if (d < bd - EPS) { bd = d; best = c; }
    }
    if (!best) continue;
    const proj = (p) => projT(best, p);
    const t0 = proj(s.p0), t1 = proj(s.p1), w = Math.min(o.width, best.len);
    if (bd > 1 || w < o.width - EPS) warn = true;
    const max = Math.max(0, best.len - w);
    if (Math.abs(t1 - t0) < 1) {
      // 辺とほぼ直角で、射影すると1点に縮む: ヒンジは保ち、射影位置を中心に置く
      o.offset = clamp(round1((t0 + t1) / 2 - w / 2), 0, max);
    } else {
      o.offset = clamp(round1(Math.min(t0, t1)), 0, max);
      if ('hinge' in o) o.hinge = (s.hingeAt0 ? t0 : t1) <= (t0 + t1) / 2 ? 'left' : 'right';
    }
    o.width = w;
    setTo(o, best);
  }
  return warn;
}
/** 点 p を辺 c(a・u)へ射影した、始点からの距離 */
const projT = (c, p) => c.u.x * (p.x - c.a.x) + c.u.y * (p.y - c.a.y);
function applyField(t, commit) {
  if (state.mode !== 'edit') return;
  const { col, id, key } = t.dataset;
  if (col === 'room' && key === 'shape') { changeRoomShape(t.value); return; }   // 形の切り替えは専用の処理(控え → 変換 → 付け替え)
  const obj = lookup(col, id);
  if (!obj) return;
  if ((col === 'doors' || col === 'windows') && key === 'edge') {
    // select の値は文字列なので辺の番号(整数)に直す
    obj.edge = clamp(Math.round(Number(t.value)) || 0, 0, roomPoly(room()).length - 1);
  } else if (t.type === 'number') {
    // 寸法は入力途中の値(120 と打つ途中の 1 など)で家具や部屋が縮んで消えて見えないよう、確定時だけ反映する。
    // 空欄のまま確定したら元の値に戻る
    if (!commit && SIZE_KEYS.includes(key)) return;
    let v = parseFloat(t.value);
    if (!Number.isFinite(v)) { if (commit) t.value = obj[key]; return; }
    const [a, b] = LIM[col + '.' + key] || LIM[key] || [-1e6, 1e6];
    obj[key] = clamp(v, a, b);
  } else if (col === 'items' && key === 'on') {
    moveItemTo(obj, t.value);
  } else {
    obj[key] = t.value;
    if (key === 'name' && !t.value.trim()) obj[key] = '';
  }
  let rerender = false;
  if ((col === 'furniture' || col === 'items') && (key === 'shape' || (key === 'w' && obj.shape === 'circle'))) {
    if (obj.shape === 'circle') obj.d = obj.w;   // 円は縦=横
    if (key === 'shape') rerender = true;         // 形が変わると入力欄の構成も変わる
  }
  if (col === 'items' && key === 'on') rerender = true;
  if ((col === 'doors' || col === 'windows') && (commit || t.tagName === 'SELECT') && ['offset', 'width', 'wall', 'edge'].includes(key)) {
    const len = openingEdge(room(), obj).len;
    obj.width = Math.min(obj.width, len);
    const off = clamp(obj.offset, 0, Math.max(0, len - obj.width));
    if (off !== obj.offset) { obj.offset = off; rerender = true; }
  }
  if (col === 'room') {
    if (key === 'name') updateChrome();
    else {
      if (commit && fitOpenings(obj)) rerender = true;   // 入力途中の値では動かさず、確定時だけ収める
      fitView();
    }
  }
  if (col === 'settings' && commit && key === 'aisleTight' && obj.aisleTight > obj.aisleMin) { obj.aisleMin = obj.aisleTight; rerender = true; }
  changed({ panel: 'none' });
  if (commit && t.type === 'number' && !rerender) t.value = obj[key];
  if (rerender) renderPanel();
}
panelBody.addEventListener('input', (e) => { if (e.target.dataset && e.target.dataset.col) applyField(e.target, false); });
panelBody.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.col) applyField(e.target, true); });

function syncInputs() {
  const f = selObj();
  if (!f || state.tab !== 'furn') return;
  const wb = $('#selWarn');
  if (wb) wb.innerHTML = warnBoxInner(f.id);
  panelBody.querySelectorAll('[data-col="furniture"],[data-col="items"]').forEach((inp) => {
    if (inp === document.activeElement || inp.dataset.id !== f.id) return;
    const v = String(f[inp.dataset.key]);
    if (inp.value !== v) inp.value = v;
  });
}

/* =====================================================================
 * 部屋の形の切り替え・部屋設計モード
 * ===================================================================== */
/** 自由な形の部屋で、いちばん長い辺に幅 w のドア・窓を置く位置 */
function longestEdgeSpot(r, w) {
  const es = roomEdges(r);
  let i = 0;
  es.forEach((e, k) => { if (e.len > es[i].len + EPS) i = k; });
  const len = es[i].len, width = Math.min(w, len);
  return { edge: i, offset: round1(Math.max(0, Math.min(20, len - width))), width: round1(width) };
}
/** 部屋タブの「形」の切り替え。長方形 → 自由な形は4隅を頂点にして設計モードへ。自由な形 → 長方形は外寸の長方形に戻す */
function changeRoomShape(v) {
  const r = room();
  if (state.mode !== 'edit' || state.locked || state.design) { renderPanel(); return; }
  const cur = isPoly(r) ? 'poly' : 'rect';
  if (v === cur) return;
  let warn;
  if (v === 'poly') {
    const snap = openingSnap(r);
    r.shape = 'poly';
    r.points = roomPoly({ width: r.width, depth: r.depth }).map((p) => ({ ...p }));
    warn = remapOpenings(r, snap);
    changed({ panel: 'none' });
    enterDesign();
  } else {
    if (!confirm('外寸の長方形に戻します。斜めの辺やへこみはなくなります。よろしいですか?')) { renderPanel(); return; }
    const snap = openingSnap(r);
    r.shape = 'rect';
    delete r.points;
    r.width = clamp(r.width, ...LIM['room.width']); r.depth = clamp(r.depth, ...LIM['room.depth']);
    warn = remapOpenings(r, snap);
    fitOpenings(r);
    fitView();
    changed({ panel: 'full' });
  }
  if (warn) toast('ドア・窓の位置を確認してください');
}

/** 設計モードに入る(編集モードで、自由な形の部屋のときだけ) */
function enterDesign() {
  const r = room();
  if (state.mode !== 'edit' || state.locked || !isPoly(r)) return;
  state.selId = null; state.focusKey = null; state.dragging = false;
  state.design = {
    pts: r.points.map((p, i) => ({ x: p.x, y: p.y, k: i })),   // k は元の頂点番号(新しく足した頂点は null)
    closed: true, sel: null, done: new Set(), undo: [], nOld: r.points.length,
  };
  state.sheet = true;
  updateChrome(); renderPanel(); syncSize(); fitView();
}
function cancelDesign() {
  if (!state.design) return;
  state.design = null;
  updateChrome(); renderPanel(); syncSize(); fitView();
}
/** 完了: 向きを時計回りにそろえ、ドア・窓を付け替えてから、左上を (0,0) に寄せる */
function finishDesign() {
  const d = state.design, r = room();
  if (!d || state.mode !== 'edit' || state.locked || designProblem()) return;
  let pts = d.pts.map((p) => ({ x: round1(p.x), y: round1(p.y) })), ks = d.pts.map((p) => p.k);
  if (polyArea(pts) < 0) { pts = pts.reverse(); ks = ks.reverse(); }
  const snap = openingSnap(r);
  r.shape = 'poly';
  r.points = pts;
  const warn = remapOpenings(r, snap, { ks, nOld: d.nOld });
  shiftToOrigin(r);
  fitOpenings(r);
  state.design = null;
  updateChrome();
  fitView();
  changed({ panel: 'full' });
  if (warn) toast('ドア・窓の位置を確認してください');
}
/** 下書きが完了できない理由(なければ null) */
function designProblem() {
  const d = state.design;
  if (!d.closed) return d.pts.length < 3 ? '角を3つ以上置いてください' : '最初の角をタップして形を閉じてください';
  return polyProblem(d.pts);
}

/* ---- 元に戻す(下書きのスナップショット。最大30) ---- */
function designPush() {
  const d = state.design;
  d.undo.push({ pts: d.pts.map((p) => ({ ...p })), closed: d.closed, sel: d.sel, done: [...d.done] });
  if (d.undo.length > 30) d.undo.shift();
}
function designRestore(s) {
  const d = state.design;
  d.pts = s.pts; d.closed = s.closed; d.sel = s.sel; d.done = new Set(s.done);
}
function designUndo() {
  const d = state.design, s = d && d.undo.pop();
  if (!s) return;
  designRestore(s);
  designRefresh();
}
/**
 * 頂点の並びを差し替えたあと、入力済みの辺(done)と選択中の頂点(sel)の番号を振り直す。
 * 両端の頂点(オブジェクト)が新しい並びでも隣どうしのままの辺だけ、入力済みとして残す
 */
function designReindex(oldPts, newPts) {
  const d = state.design, n0 = oldPts.length, n1 = newPts.length, done = new Set();
  for (const j of d.done) {
    const a = oldPts[j], b = oldPts[(j + 1) % n0], i = newPts.indexOf(a);
    if (i >= 0 && newPts[(i + 1) % n1] === b) done.add(i);
  }
  d.done = done;
  d.sel = d.sel == null ? null : (newPts.indexOf(oldPts[d.sel]) >= 0 ? newPts.indexOf(oldPts[d.sel]) : null);
}
function designDeleteVertex() {
  const d = state.design;
  if (!d || !d.closed || d.pts.length < 4 || d.sel == null) return;
  designPush();
  const old = d.pts, np = old.filter((_, i) => i !== d.sel);
  d.sel = null;
  designReindex(old, np);
  d.pts = np;
  designRefresh();
}
function designRestart() {
  const d = state.design;
  if (!d) return;
  designPush();
  d.pts = []; d.closed = false; d.sel = null; d.done = new Set();
  designRefresh();   // 表示位置はそのまま(薄く出している家具をなぞれるように)
}
/** 辺 i の中点に頂点を足す */
function designInsert(i) {
  const d = state.design, old = d.pts, a = old[i], b = old[(i + 1) % old.length];
  if (old.length >= POLY_MAX) { toast(`角は${POLY_MAX}個までです`); return; }
  designPush();
  const np = old.slice(), v = { x: snapV((a.x + b.x) / 2), y: snapV((a.y + b.y) / 2), k: null };
  np.splice(i + 1, 0, v);
  designReindex(old, np);
  d.pts = np;
  d.sel = i + 1;
  designRefresh();
}
/** 下書きが変わったら配置図とパネルを描き直す。入力欄のフォーカスは、描き直したあとも同じ辺の欄に戻す */
function designRefresh() {
  requestRender();
  const a = document.activeElement, k = a && a.dataset ? a.dataset.dedge : undefined;
  renderPanel();
  if (k != null) { const el = panelBody.querySelector(`[data-dedge="${k}"]`); if (el) el.focus(); }
}

/** 辺の向き: 'h'(水平)・'v'(垂直)・'d'(斜め) */
function edgeKind(a, b) {
  if (Math.abs(b.y - a.y) < 0.01) return 'h';
  if (Math.abs(b.x - a.x) < 0.01) return 'v';
  return 'd';
}
/**
 * 軸平行の辺 i の長さを L にする。辺の向きに沿って頂点をずらし、変化はどこかの辺に吸収させる。
 * 前向き: i+1 から順にずらし、次の辺がこの向きと垂直なら次の頂点もずらす。垂直でない辺(平行 or 斜め)で止まり、その辺が吸収する。
 * 後ろ向き: i から逆順に同様。吸収する辺は「斜め」>「未入力の平行な辺」>「入力済みの平行な辺」の順に良く、同じなら前向き。
 * 戻り値: 'ok' / 'none'(吸収する辺がない)/ 'bad'(形がくずれるので元に戻した)/ 'skip'(軸平行でない)
 */
function setEdgeLen(i, L) {
  const d = state.design, P = d.pts, n = P.length;
  const a = P[i], b = P[(i + 1) % n], kind = edgeKind(a, b);
  if (kind === 'd') return 'skip';
  const cur = kind === 'h' ? Math.abs(b.x - a.x) : Math.abs(b.y - a.y);
  L = clamp(L, 1, 3000);
  const delta = L - cur;
  if (Math.abs(delta) < 0.05) { d.done.add(i); return 'ok'; }   // 実測どおり: 頂点は動かさず ✓ だけ付ける
  const dir = kind === 'h' ? { x: Math.sign(b.x - a.x), y: 0 } : { x: 0, y: Math.sign(b.y - a.y) };
  const perp = (e0, e1) => (kind === 'h' ? edgeKind(e0, e1) === 'v' : edgeKind(e0, e1) === 'h');
  /** step=+1 は前向き、-1 は後ろ向き。ずらす頂点と吸収する辺を返す(なければ null) */
  const walk = (step) => {
    const moved = [];
    let v = step > 0 ? (i + 1) % n : i;
    for (let c = 0; c < n; c++) {
      moved.push(v);
      const w = (v + step + n) % n;   // 次の頂点
      const e = step > 0 ? v : w;      // v と w を結ぶ辺の番号
      if (e === i) return null;        // 一周した
      if (!perp(P[v], P[w])) {
        const k = edgeKind(P[e], P[(e + 1) % n]);
        return { moved, absorb: e, rank: k === 'd' ? 0 : d.done.has(e) ? 2 : 1 };
      }
      v = w;
    }
    return null;
  };
  const fw = walk(1), bw = walk(-1);
  const pick = fw && (!bw || fw.rank <= bw.rank) ? { ...fw, sg: 1 } : bw ? { ...bw, sg: -1 } : null;
  if (!pick) return 'none';
  const before = polyProblem(P);
  designPush();
  for (const v of pick.moved) {
    P[v].x += dir.x * delta * pick.sg;
    P[v].y += dir.y * delta * pick.sg;
  }
  if (!before && polyProblem(P)) { designRestore(d.undo.pop()); return 'bad'; }
  d.done.add(i);
  if (pick.absorb !== i) d.done.delete(pick.absorb);
  return 'ok';
}

/** 吸着: 設定の単位に丸め、前後の頂点と x(y)の差が画面上12px以内ならそろえる(辺が水平・垂直になる) */
function designSnap(p, nbrs) {
  let x = snapV(p.x), y = snapV(p.y);
  const th = 12 / view.s;
  let bx = th, by = th;
  for (const q of nbrs) {
    if (!q) continue;
    if (Math.abs(p.x - q.x) <= bx) { bx = Math.abs(p.x - q.x); x = q.x; }
    if (Math.abs(p.y - q.y) <= by) { by = Math.abs(p.y - q.y); y = q.y; }
  }
  return { x, y };
}
/** ポインタ位置(stage 内の px)から当たりを探す。頂点 → 「＋」の順(半径は画面上22px) */
function designHit(p) {
  const d = state.design, R = 22;
  const scr = (q) => ({ x: q.x * view.s + view.tx, y: q.y * view.s + view.ty });
  let best = null, bd = R;
  d.pts.forEach((q, i) => { const s = scr(q), dd = Math.hypot(s.x - p.x, s.y - p.y); if (dd <= bd) { bd = dd; best = { type: 'vtx', i }; } });
  if (best || !d.closed) return best;
  d.pts.forEach((q, i) => {
    const b = d.pts[(i + 1) % d.pts.length], s = scr({ x: (q.x + b.x) / 2, y: (q.y + b.y) / 2 }), dd = Math.hypot(s.x - p.x, s.y - p.y);
    if (dd <= bd) { bd = dd; best = { type: 'plus', i }; }
  });
  return best;
}
/** 動かさずに離したタップ */
function designTap(p, hit) {
  const d = state.design, w = { x: (p.x - view.tx) / view.s, y: (p.y - view.ty) / view.s };
  if (!d.closed) {
    if (hit && hit.type === 'vtx') {
      if (hit.i === 0 && d.pts.length >= 3) { designPush(); d.closed = true; d.sel = null; designRefresh(); }
      return;   // 他の頂点の上には置かない(長さ0の辺になる)
    }
    if (d.pts.length >= POLY_MAX) { toast(`角は${POLY_MAX}個までです`); return; }
    designPush();
    const q = designSnap(w, [d.pts[d.pts.length - 1], d.pts[0]]);
    d.pts.push({ x: q.x, y: q.y, k: null });
    designRefresh();
    return;
  }
  if (hit && hit.type === 'vtx') d.sel = hit.i;
  else if (hit && hit.type === 'plus') { designInsert(hit.i); return; }
  else d.sel = null;
  designRefresh();
}

/** 設計モードの配置図: グリッド・薄い家具・下書きの多角形・頂点・辺の長さ・「＋」 */
function designMarkup() {
  const r = room(), d = state.design, s = view.s, inv = 1 / s, ns = 'vector-effect="non-scaling-stroke"';
  const { w: vw, h: vh } = view.w > 10 ? view : stageSize();
  let h = `<g transform="translate(${view.tx} ${view.ty}) scale(${s})">`;
  // グリッド(見えている範囲全体)。細かすぎるときは間引く
  const x0 = -view.tx * inv, x1 = (vw - view.tx) * inv, y0 = -view.ty * inv, y1 = (vh - view.ty) * inv;
  let step = 50;
  while (step * s < 6) step *= 2;
  const major = Math.max(100, step * 2);
  for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) h += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${x % major === 0 ? '#c3c8d0' : '#dde1e6'}" stroke-width="1" ${ns}/>`;
  for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) h += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${y % major === 0 ? '#c3c8d0' : '#dde1e6'}" stroke-width="1" ${ns}/>`;
  const P = d.pts, n = P.length;
  if (d.closed && n >= 3) h += `<path d="${polyD(P)}" fill="#fff" fill-opacity=".85" stroke="#5f6368" stroke-width="3" stroke-linejoin="round" ${ns}/>`;
  else if (n >= 2) h += `<path d="M${P.map((q) => `${q.x} ${q.y}`).join('L')}" fill="none" stroke="#5f6368" stroke-width="3" stroke-linejoin="round" ${ns}/>`;
  // 今の家具・固定物を薄く(操作はできない。クラスや data 属性は付けない)
  for (const x of r.fixtures) h += `<rect x="${x.x}" y="${x.y}" width="${x.w}" height="${x.d}" fill="#cfd3d9" fill-opacity=".5" stroke="#9aa0a8" stroke-width="1" ${ns}/>`;
  for (const f of r.furniture) {
    const R = fRect(f), at = `fill="${f.color}" fill-opacity=".3" stroke="#9aa0a8" stroke-width="1" ${ns}`;
    h += R.round ? `<ellipse cx="${R.x0 + R.w / 2}" cy="${R.y0 + R.d / 2}" rx="${R.w / 2}" ry="${R.d / 2}" ${at}/>` : `<rect x="${R.x0}" y="${R.y0}" width="${R.w}" height="${R.d}" ${at}/>`;
  }
  // 辺の長さラベルと「＋」
  const m = d.closed ? n : n - 1, sg = d.closed && polyArea(P) < 0 ? -1 : 1;
  for (let i = 0; i < m; i++) {
    const a = P[i], b = P[(i + 1) % n], len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len < EPS) continue;
    const ux = (b.x - a.x) / len, uy = (b.y - a.y) / len, ox = uy * sg, oy = -ux * sg;   // 外側(時計回りなら左手側)
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, kind = edgeKind(a, b);
    if (len * s >= 24) {
      const anchor = Math.abs(ox) > 0.5 ? (ox > 0 ? 'start' : 'end') : 'middle';
      const col = kind === 'd' ? '#8a5a00' : d.done.has(i) ? '#2e7d32' : '#333';
      h += T(mx, my, `${circled(i)}${kind === 'd' ? '斜め' : ''}${fmt(len)}${d.done.has(i) ? '✓' : ''}`, { px: 12, bold: true, fill: col, dx: ox * 16, dy: oy * 16, anchor });
    }
    if (d.closed) h += `<g transform="translate(${mx} ${my}) scale(${inv})"><circle r="9" fill="#fff" stroke="${BLUE}" stroke-width="1.5"/><path d="M-4.5 0H4.5M0 -4.5V4.5" stroke="${BLUE}" stroke-width="2"/></g>`;
  }
  // 頂点(番号つき)。閉じる前は、最初の角を緑で示す(タップで閉じる)
  P.forEach((q, i) => {
    const on = d.sel === i, first = !d.closed && i === 0 && n >= 3;
    const fill = on ? BLUE : first ? '#2e7d32' : '#fff', tc = on || first ? '#fff' : '#222';
    h += `<g transform="translate(${q.x} ${q.y}) scale(${inv})"><circle r="9" fill="${fill}" stroke="${on ? '#fff' : '#3c4043'}" stroke-width="1.5"/><text dy=".35em" text-anchor="middle" font-size="10" font-weight="700" fill="${tc}">${i + 1}</text></g>`;
  });
  h += '</g>';
  return h;
}

/** 設計モードのパネル */
function designPanel() {
  const d = state.design, P = d.pts, n = P.length, prob = designProblem();
  const dirLabel = (a, b) => (edgeKind(a, b) === 'h' ? (b.x > a.x ? '→右へ' : '←左へ') : (b.y > a.y ? '↓下へ' : '↑上へ'));
  const rows = d.closed ? P.map((a, i) => {
    const b = P[(i + 1) % n], len = Math.hypot(b.x - a.x, b.y - a.y);
    if (edgeKind(a, b) === 'd') return `<div class="drow"><span class="dname">辺${i + 1}</span><span class="dauto" style="flex:1">斜め ${fmt(len)}cm(自動)</span></div>`;
    return `<div class="drow"><span class="dname">辺${i + 1}</span><span class="ddir">${dirLabel(a, b)}</span>
      <input type="number" inputmode="decimal" step="any" data-dedge="${i}" value="${fmt(len)}" aria-label="辺${i + 1}の長さ(cm)" autocomplete="off"><span>cm</span>
      <span class="dok">${d.done.has(i) ? '✓' : ''}</span></div>`;
  }).join('') : '';
  return `<div class="stack">
    <p style="margin:0">${d.closed ? '辺の長さを入れて仕上げます。角はドラッグで動かせます。辺の「＋」で角を足せます。' : '配置図をタップして角を順に置きます。最初の角をタップすると閉じます。'}</p>
    ${d.closed ? `<div class="dlist">${rows}</div>
    <p class="note" style="margin:0">長さを入れると、つながる辺が一緒に動き、斜めの辺(なければ向かいの辺)が長さの変化を吸収します。✓ は入力済みの辺です。斜めになった辺は、角をドラッグして隣の角にそろえると数値を入れられます。</p>` : ''}
    <div id="dprob" class="warnbox" style="margin:0">${prob ? esc(prob) : ''}</div>
    <div class="grid3">
      <button class="btn" data-act="dUndo" ${d.undo.length ? '' : 'disabled'}>元に戻す</button>
      <button class="btn" data-act="dDelete" ${d.closed && n >= 4 && d.sel != null ? '' : 'disabled'}>選んだ角を削除</button>
      <button class="btn" data-act="dRestart">最初から描き直す</button>
    </div>
    <div class="grid2">
      <button class="btn" data-act="dCancel">キャンセル</button>
      <button class="btn primary" data-act="dDone" ${prob ? 'disabled' : ''}>完了</button>
    </div>
  </div>`;
}
panelBody.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.dedge;
  if (k == null || !state.design) return;
  const v = parseFloat(e.target.value), i = Number(k);
  if (!Number.isFinite(v)) { designSyncPanel(); return; }
  const res = setEdgeLen(i, v);
  if (res === 'bad') toast('その長さにすると形がくずれます');
  else if (res === 'none') toast('この辺の長さは変えられません(変化を受け止める辺がありません)');
  requestRender();
  designSyncPanel();
});
/**
 * 長さ入力のあと、パネルを作り直さずに値・✓・理由・ボタンの状態だけ更新する。
 * (change は別の場所を押した瞬間の blur で起きるので、作り直すと「完了」などのクリックが失われる。フォーカスも保てる)
 */
function designSyncPanel() {
  const d = state.design;
  if (!d) return;
  const P = d.pts, n = P.length, prob = designProblem();
  panelBody.querySelectorAll('.drow').forEach((row, i) => {
    const a = P[i], b = P[(i + 1) % n];
    if (!a || !b) return;
    const len = Math.hypot(b.x - a.x, b.y - a.y), inp = row.querySelector('input');
    if (inp) {
      inp.value = fmt(len);
      const ok = row.querySelector('.dok');
      if (ok) ok.textContent = d.done.has(i) ? '✓' : '';
    } else {
      const t = row.querySelector('.dauto');
      if (t) t.textContent = `斜め ${fmt(len)}cm(自動)`;
    }
  });
  const pb = $('#dprob');
  if (pb) pb.textContent = prob || '';
  const btn = (a) => panelBody.querySelector(`[data-act="${a}"]`);
  if (btn('dUndo')) btn('dUndo').disabled = !d.undo.length;
  if (btn('dDone')) btn('dDone').disabled = !!prob;
}

/* =====================================================================
 * 変更通知・クロム(上部バーなど)
 * ===================================================================== */
function changed(o = {}) {
  recompute();
  updateChrome();
  requestRender();
  if (o.panel === 'full') renderPanel();
  else if (state.tab === 'warn' || (state.tab === 'furn' && !selObj())) renderPanel();
  else syncInputs();
  scheduleSave();
  if (state.tab === 'file') scheduleShareInfo();
}

function updateChrome() {
  const r = room(), n = state.warns.length;
  const reds = state.warns.filter((w) => w.level === 'red').length;
  $('#btnRoom').textContent = state.design ? '部屋の形を編集中' : `${r.name}(${isPoly(r) ? '自由な形 ' : ''}${fmt(r.width)}×${fmt(r.depth)})`;
  const b = $('#badge');
  b.textContent = n ? `⚠ ${n}` : '✓ OK';
  b.className = reds ? 'red' : n ? 'yel' : '';
  b.setAttribute('aria-label', n ? `警告 ${n} 件(赤 ${reds} 件)` : '警告なし');
  const ro = state.mode !== 'edit';
  app.classList.toggle('edit', !ro);
  app.classList.toggle('view', ro);
  $('#btnMode').textContent = ro ? '✎ 編集する' : '👁 閲覧モード';
  $('#btnAdd').disabled = ro || !!state.design;
  $('#btnMode').disabled = !!state.design;   // 設計モード中は追加・モード切替をしない
  app.classList.toggle('design', !!state.design);
  const notice = $('#notice');
  notice.classList.toggle('show', state.locked);
  notice.querySelector('span').textContent = '共有リンクの内容を閲覧中です。このブラウザの保存データはまだ変更されていません。';
  $('#btnRuler').setAttribute('aria-pressed', String(state.ruler));
  const bt = $('#btnText');
  bt.setAttribute('aria-pressed', String(state.hideText));
  bt.setAttribute('aria-label', state.hideText ? '文字を表示する' : '文字を隠す');
  bt.title = state.hideText ? '文字を表示する' : '文字を隠す(一覧表示用)';
  const bw = $('#btnWarn');
  bw.setAttribute('aria-pressed', String(state.hideWarn));
  bw.setAttribute('aria-label', state.hideWarn ? '警告を表示する' : '警告を隠す');
  bw.title = state.hideWarn ? '警告を表示する' : '警告を隠す(配置図の斜線・マーク)';
  $('#rulerHint').hidden = !(state.ruler && !state.selId && !state.design);
  const wt = tabsEl.querySelector('[data-tab="warn"]');
  if (wt) wt.textContent = '警告' + (n ? `(${n})` : '');
}

function setMode(m) {
  if (m === 'edit' && state.locked) {
    const local = readLocalRaw();
    if (local && local !== JSON.stringify(state.data)) {
      if (!confirm('編集を始めると、このブラウザに保存されている配置データが共有リンクの内容で上書きされます。よろしいですか?')) return;
    }
    state.locked = false;
    history.replaceState(null, '', location.pathname + location.search);
    saveNow();
  }
  state.mode = m;
  state.design = null;
  if (m === 'view') { state.dragging = false; }
  updateChrome();
  renderPanel();
  requestRender();
}

function openTab(tab) {
  state.tab = tab;
  state.sheet = true;
  renderPanel();
  syncSize();
}

/* =====================================================================
 * 保存(localStorage / JSON / URL共有)
 * ===================================================================== */
let saveTimer = null;
function readLocalRaw() { try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; } }
function saveNow() {
  clearTimeout(saveTimer);
  if (state.locked) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (_) { /* 容量超過・プライベートモード等 */ }
}
function scheduleSave() {
  if (state.locked) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 250);
}
function loadLocal() {
  const raw = readLocalRaw();
  if (!raw) return null;
  try { return normalize(JSON.parse(raw)); } catch (_) { return null; }
}

function b64url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64url(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function pipeBytes(bytes, stream) {
  const w = stream.writable.getWriter();
  w.write(bytes); w.close();
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}
async function encodeShare(data) {
  if (typeof CompressionStream === 'undefined') throw new Error('このブラウザは圧縮に対応していません');
  const z = await pipeBytes(new TextEncoder().encode(JSON.stringify(data)), new CompressionStream('deflate-raw'));
  return 'v1.' + b64url(z);
}
async function decodeShare(code) {
  if (!code.startsWith('v1.')) throw new Error('未対応の形式です');
  if (typeof DecompressionStream === 'undefined') throw new Error('このブラウザは展開に対応していません');
  const raw = await pipeBytes(unb64url(code.slice(3)), new DecompressionStream('deflate-raw'));
  return normalize(JSON.parse(new TextDecoder().decode(raw)));
}
async function shareUrl() {
  const base = location.href.split('#')[0];
  return base + '#' + await encodeShare(state.data);
}

let shareTimer = null;
function scheduleShareInfo() { clearTimeout(shareTimer); shareTimer = setTimeout(updateShareInfo, 300); }
async function updateShareInfo() {
  const el = $('#shareInfo');
  if (!el) return;
  try {
    const url = await shareUrl();
    const el2 = $('#shareInfo');
    if (!el2) return;
    const n = url.length;
    el2.innerHTML = `URLの長さ: <b>${n.toLocaleString()}</b> 文字` + (n > 2000 ? '<div class="warnbox">⚠ 2,000文字を超えています。LINEやメールなど一部のアプリで、リンクが途中で切れることがあります。長い場合はJSONファイルでの共有も使ってください。</div>' : '');
  } catch (e) {
    const el2 = $('#shareInfo');
    if (el2) el2.textContent = '共有リンクを作れません: ' + e.message;
  }
}
async function copyLink() {
  try {
    const url = await shareUrl();
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (_) { /* フォールバックへ */ }
    const box = $('#shareUrl');
    if (box) { box.hidden = false; box.value = url; if (!ok) { box.focus(); box.select(); try { ok = document.execCommand('copy'); } catch (_) { /* noop */ } } }
    toast(ok ? '共有リンクをコピーしました' : 'コピーできませんでした。下の欄から手動でコピーしてください');
  } catch (e) { toast('共有リンクを作れません: ' + e.message); }
}
function exportJson() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `layout-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importJsonFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = normalize(JSON.parse(fr.result));
      if (!confirm('現在の配置を、読み込んだファイルの内容で置き換えますか?')) return;
      replaceData(data);
      toast('読み込みました');
    } catch (e) { toast('読み込めませんでした: ' + e.message); }
  };
  fr.onerror = () => toast('ファイルを読めませんでした');
  fr.readAsText(file);
}
function replaceData(data) {
  state.data = data;
  state.design = null;
  state.selId = null; state.focusKey = null;
  if (state.tab === 'furn') state.sheet = false;
  recompute();
  updateChrome();
  renderPanel();
  syncSize();
  fitView();
  scheduleSave();
}

/* =====================================================================
 * 表示設定(文字の非表示)・印刷
 * ===================================================================== */
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    state.hideText = !!p.hideText; state.hideWarn = !!p.hideWarn;
  } catch (_) { /* 既定値のまま */ }
}
function savePrefs() {
  try { localStorage.setItem(PREF_KEY, JSON.stringify({ hideText: state.hideText, hideWarn: state.hideWarn })); } catch (_) { /* noop */ }
}
function setHideText(v) {
  state.hideText = v;
  savePrefs();
  updateChrome();
  if (state.tab === 'file') renderPanel();
  requestRender();
  toast(v ? '文字を非表示にしました(選択中の名前だけ表示します)' : '文字を表示しました');
}
function setHideWarn(v) {
  state.hideWarn = v;
  savePrefs();
  updateChrome();
  if (state.tab === 'file') renderPanel();
  requestRender();
  toast(v ? '配置図の警告表示を隠しました(件数と一覧は残ります)' : '警告を表示しました');
}

/** 印刷用の配置図。画面の拡大縮小とは無関係に、部屋全体が収まる大きさで描き直す */
function printSvg(landscape) {
  const r = room(), W = r.width, D = r.depth;
  const vwMax = landscape ? 1000 : 700, vhMax = landscape ? 520 : 720;
  const m = isPoly(r) ? { l: 56, r: 56, t: 22, b: 22 } : { l: 56, r: 16, t: 22, b: 12 };   // 寸法ラベルが出る側だけ広めに
  const s = clamp(Math.min((vwMax - m.l - m.r) / (W + 2 * WALL_T), (vhMax - m.t - m.b) / (D + 2 * WALL_T)), 0.05, 20);
  const tx = m.l + WALL_T * s, ty = m.t + WALL_T * s;
  const vw = tx + (W + WALL_T) * s + m.r, vh = ty + (D + WALL_T) * s + m.b;
  const keep = { ...view };
  Object.assign(view, { s, tx, ty, w: vw, h: vh });   // T() などが view.s を参照するため一時的に差し替える
  try {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vw} ${vh}" role="img" aria-label="部屋の配置図">${planMarkup({ print: true, idp: 'p_' })}</svg>`;
  } finally { Object.assign(view, keep); }
}
function buildPrint() {
  const r = room(), landscape = r.width > r.depth * 1.15, d = new Date();
  $('#pageStyle').textContent = `@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:10mm}`;
  const sizeOf = (o) => (o.shape === 'circle' ? `直径 ${fmt(o.w)}` : `${fmt(o.w)} × ${fmt(o.d)}`);
  const furnRows = r.furniture.map((f) => `<tr><td>${esc(f.name)}</td><td>${SHAPE_LABEL[f.shape]}</td><td>${sizeOf(f)}</td><td>${fmt(f.h)}</td><td>${f.front > 0 ? fmt(f.front) : '-'}</td><td>${fmt(f.x)}, ${fmt(f.y)}</td></tr>`).join('');
  const itemRows = r.items.map((i) => {
    const b = r.furniture.find((f) => f.id === i.on);
    return `<tr><td>${esc(i.name)}</td><td>${b ? esc(b.name) : ''}</td><td>${SHAPE_LABEL[i.shape]}</td><td>${sizeOf(i)}</td><td>${fmt(i.h)}</td></tr>`;
  }).join('');
  const warns = state.warns.map((w) => `<li>${w.level === 'red' ? '✕ ' : '▲ '}${esc(w.text)}</li>`).join('');
  $('#printArea').innerHTML = `
    <h1>${esc(r.name)}</h1>
    <p class="meta">部屋 ${isPoly(r) ? `自由な形(頂点${r.points.length}個・外寸 ${fmt(r.width)} × ${fmt(r.depth)} cm)` : `${fmt(r.width)} × ${fmt(r.depth)} cm`} ／ ${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 印刷 ／ 判定: 赤 ${state.warns.filter((w) => w.level === 'red').length} 件・黄 ${state.warns.filter((w) => w.level !== 'red').length} 件</p>
    <div class="pplan">${printSvg(landscape).replace('<svg ', `<svg style="max-height:${landscape ? 125 : 165}mm" `)}</div>
    <h2>家具(単位 cm)</h2>
    ${furnRows ? `<table><thead><tr><th>名前</th><th>形</th><th>横 × 縦</th><th>高さ</th><th>前方</th><th>位置 X, Y</th></tr></thead><tbody>${furnRows}</tbody></table>` : '<p>なし</p>'}
    ${itemRows ? `<h2>小物(単位 cm)</h2><table><thead><tr><th>名前</th><th>載せる家具</th><th>形</th><th>横 × 縦</th><th>高さ</th></tr></thead><tbody>${itemRows}</tbody></table>` : ''}
    <h2>チェック結果</h2>
    ${warns ? `<ul>${warns}</ul>` : '<p>問題は見つかりませんでした。</p>'}`;
}
function printNow() {
  buildPrint();
  window.print();
}
window.addEventListener('beforeprint', buildPrint);   // ブラウザのメニューや Ctrl+P から印刷した場合にも最新の内容にする

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* =====================================================================
 * クリック操作(イベント委譲)
 * ===================================================================== */
/** 設計モード中に受け付ける操作(タブの切り替え・シートを閉じる・メニューなどは無効) */
const DESIGN_ACTS = new Set(['fit', 'zoomIn', 'zoomOut', 'toggleText', 'dUndo', 'dDelete', 'dRestart', 'dCancel', 'dDone']);
document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { if (!state.design) openTab(tabBtn.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (state.design && !DESIGN_ACTS.has(b.dataset.act)) return;
  const d = b.dataset, r = room();
  switch (d.act) {
    case 'openRoom': openTab('room'); break;
    case 'openWarn': openTab('warn'); break;
    case 'openMenu':
      if (state.sheet && matchMedia('(max-width:767px)').matches) { state.sheet = false; renderPanel(); syncSize(); } else openTab(state.tab === 'furn' && !selObj() ? 'room' : state.tab);
      break;
    case 'openShare': openTab('file'); break;
    case 'closeSheet': state.sheet = false; if (state.tab === 'furn') state.selId = null; updateChrome(); renderPanel(); syncSize(); requestRender(); break;
    case 'startEdit': setMode('edit'); break;
    case 'toggleMode': setMode(state.mode === 'edit' ? 'view' : 'edit'); break;
    case 'ruler': state.ruler = !state.ruler; updateChrome(); requestRender(); break;
    case 'fit': fitView(); break;
    case 'zoomIn': zoomAt(view.w / 2, view.h / 2, 1.3); break;
    case 'zoomOut': zoomAt(view.w / 2, view.h / 2, 1 / 1.3); break;
    case 'addDlg': openDlg(d.type, d.shape, d.on); break;
    case 'dlgOk': createFromDlg(); break;
    case 'dlgCancel': closeDlg(); break;
    case 'toggleText': setHideText(!state.hideText); break;
    case 'toggleWarn': setHideWarn(!state.hideWarn); break;
    case 'print': printNow(); break;
    case 'selectFurn': select(d.id); break;
    case 'deselect': deselect(); break;
    case 'rot': rotateSel(); break;
    case 'dup': duplicateSel(); break;
    case 'del': deleteSel(); break;
    case 'nudge': nudge(Number(d.dx), Number(d.dy)); break;
    case 'focusWarn': {
      const w = state.warns.find((o) => o.key === d.key);
      if (w) { state.focusKey = w.key; zoomToRect(w.rect); }
      break;
    }
    case 'addFixture': r.fixtures.push({ id: nextId(r.fixtures, 'f'), name: '出っ張り', x: 0, y: 0, w: 30, d: 30 }); changed({ panel: 'full' }); break;
    case 'addDoor': {   // 長方形は下の壁、自由な形はいちばん長い辺に置く
      const id = nextId(r.doors, 'd'), base = { type: 'swing', hinge: 'left', opens: 'in' };
      if (isPoly(r)) r.doors.push({ id, ...longestEdgeSpot(r, 80), ...base });
      else r.doors.push({ id, wall: 'bottom', offset: Math.min(20, Math.max(0, r.width - 80)), width: Math.min(80, r.width), ...base });
      changed({ panel: 'full' });
      break;
    }
    case 'addWindow': {
      const id = nextId(r.windows, 'w');
      if (isPoly(r)) r.windows.push({ id, ...longestEdgeSpot(r, 160), sill: 90 });
      else r.windows.push({ id, wall: 'top', offset: Math.min(100, Math.max(0, r.width - 100)), width: Math.min(160, r.width), sill: 90 });
      changed({ panel: 'full' });
      break;
    }
    case 'editShape': enterDesign(); break;
    case 'dUndo': designUndo(); break;
    case 'dDelete': designDeleteVertex(); break;
    case 'dRestart': designRestart(); break;
    case 'dCancel': cancelDesign(); break;
    case 'dDone': finishDesign(); break;
    case 'delItem': {
      r[d.col] = r[d.col].filter((o) => o.id !== d.id);
      changed({ panel: 'full' });
      break;
    }
    case 'copyLink': copyLink(); break;
    case 'exportJson': exportJson(); break;
    case 'importJson': $('#fileIn').click(); break;
    case 'newRoom': if (confirm('すべての配置を消して、空の部屋にしますか?(判定の設定は残ります)')) replaceData(emptyData(state.data.settings)); break;
    case 'sample': if (confirm('現在の配置を消して、サンプルに戻しますか?')) replaceData(sampleData()); break;
  }
});
$('#fileIn').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) importJsonFile(f);
});

document.addEventListener('keydown', (e) => {
  if (dlgEl.classList.contains('show')) {
    if (e.key === 'Escape') closeDlg();
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); createFromDlg(); }   // 日本語入力の確定Enterでは追加しない(229はSafari対策)
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'select' || tag === 'textarea';
  if (state.design) {   // 設計モード: 家具用のショートカットは使わない。Escape は入力中なら確定(blur)だけ、それ以外はキャンセル
    if (e.key === 'Escape') {
      if (typing) e.target.blur(); else cancelDesign();
      e.preventDefault();
    }
    return;
  }
  if (typing) return;
  const f = selObj();
  if (!f || state.mode !== 'edit') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // Ctrl+R(再読み込み)などブラウザのショートカットを横取りしない
  const n = e.shiftKey ? 10 : 1;
  switch (e.key) {
    case 'ArrowLeft': nudge(-n, 0); break;
    case 'ArrowRight': nudge(n, 0); break;
    case 'ArrowUp': nudge(0, -n); break;
    case 'ArrowDown': nudge(0, n); break;
    case 'Delete': case 'Backspace': deleteSel(); break;
    case 'r': case 'R': rotateSel(); break;
    case 'Escape': deselect(); break;
    default: return;
  }
  e.preventDefault();
});

window.addEventListener('hashchange', () => { if (location.hash.length > 1) loadFromHash(); });
window.addEventListener('pagehide', saveNow);

/* =====================================================================
 * 起動
 * ===================================================================== */
async function loadFromHash() {
  try {
    const data = await decodeShare(location.hash.slice(1));
    state.data = data;
    state.design = null;
    state.locked = true; state.mode = 'view';
    state.selId = null; state.focusKey = null; state.sheet = false;
    recompute(); updateChrome(); renderPanel(); syncSize(); fitView();
    return true;
  } catch (e) {
    toast('共有リンクを読み込めませんでした: ' + e.message);
    return false;
  }
}

async function boot() {
  loadPrefs();
  state.data = loadLocal() || sampleData();
  recompute();
  updateChrome();
  renderPanel();
  const { w, h } = stageSize();
  view.w = w; view.h = h;
  fitView();
  if (location.hash.length > 1) await loadFromHash();
  window.__app = { state, view, room, computeWarnings, fitView, normalize };   // 動作確認用
}
boot();
})();
</script>
